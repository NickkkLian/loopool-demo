// ---------- buttons ----------
document.addEventListener('click', async e => {
  const menu = $('[data-bmenu]');
  if (menu && !menu.hidden && !e.target.closest('.bapp-menu')) { menu.hidden = true; $('[data-act="bmenu"]').setAttribute('aria-expanded', 'false'); }
  const a = e.target.closest('[data-act]'); if (!a || a.disabled) return;
  const x = a.dataset.act;
  const go = screen => { BAPP.screen = screen; BAPP.sig = {}; S.sigs.clear(); render(); window.scrollTo(0, 0); };
  if (x === 'bmenu') { menu.hidden = !menu.hidden; a.setAttribute('aria-expanded', String(!menu.hidden)); return; }
  if (x.startsWith('bm-')) {
    menu.hidden = true; $('[data-act="bmenu"]').setAttribute('aria-expanded', 'false');
    if (x === 'bm-edit') { BAPP.editing = true; BIZ.dirty = false; const el = $('[data-bs="setup"]'); el.dataset.mode = ''; render(); window.scrollTo(0, 0); }
    else if (x === 'bm-player') goRole('player');
    else if (x === 'bm-delete') {
      const v = S.state.venue;
      if (!await askConfirm({ title: tr('biz.delTitle', { name: v.name }), text: tr('biz.delText'), yes: tr('biz.delYes'), no: tr('biz.delNo') })) return;
      if (BAPP.cam) BAPP.cam.stopAll();
      const r = await act('venue_delete'); if (r && r.ok) { BAPP.editing = false; BAPP.screen = 'home'; $('[data-bs="setup"]').dataset.mode = ''; toast(tr('biz.deleted')); render(); }
    }
    return;
  }
  if (!x.startsWith('biz-')) return;
  const y = x.slice(4);
  if (y === 'autofill') bizAutofill();
  else if (y === 'tostart') { store.set('role', null); if (location.hash) location.hash = ''; else route(); }
  else if (y === 'editcancel') { BAPP.editing = false; BIZ.dirty = false; go('home'); }
  else if (y === 'testmaps') { e.preventDefault(); const u = $('#bpMaps').value.trim(); if (/^https:\/\//.test(u)) window.open(u, '_blank', 'noopener'); else toast(tr('biz.mapsFirst')); }
  else if (y === 'home') { BAPP.event = null; BAPP.startTable = null; go('home'); }
  else if (y === 'start') { BAPP.event = null; BAPP.startTable = a.dataset.t || null; go('start'); }   // a table card passes its table in data-t
  else if (y === 'evstart') { BAPP.event = a.dataset.ev; BAPP.startTable = null; go('start'); }
  else if (y === 'tocam') { BAPP.camFrom = 'start'; go('camera'); }
  else if (y === 'camback') go(BAPP.camFrom === 'home' ? 'home' : 'start');
  else if (y === 'camdone') {
    if (BAPP.cam && !BAPP.cam.running().length && !await askConfirm({ title: tr('biz.camNotOnTitle'), text: tr('biz.camNotOnText'), yes: tr('biz.camNotOnYes'), no: tr('biz.camNotOnNo') })) return;
    await openNight(); BAPP.event = null; BAPP.startTable = null; go('tv');
  }
  else if (y === 'totv') go('tv');
  else if (y === 'tvexit') go('home');
  else if (y === 'stopcam') { if (BAPP.cam) BAPP.cam.stopAll(); BAPP.sig = {}; toast(tr('biz.camStopped')); render(); }
  else if (y === 'callnext') {
    const select = $('#qTable'); if (!select) return;
    const table = select.value, t = ((S.state && S.state.tables) || []).find(k => k.id === table), first = ((S.state && S.state.queue) || []).find(q => q.status === 'waiting');
    const r = await act('next_match', { table });
    if (r && r.ok) {
      const called = first && r.queue.some(q => q.ticket === first.ticket && q.status === 'called');
      if (!called) { toast(tr('biz.notCalled', { table: t ? tname(t) : table })); return; }
      BAPP.startTable = null; toast(tr('biz.called', { table: t ? tname(t) : table })); go('home');
    }
  }
  else if (y === 'open') {                                   // start the night: players can join the queue from now on
    const r = await act('venue_open', { open: '1' }); if (r && r.ok) { BAPP.sig = {}; toast(tr('biz.opened')); render(); }
  }
  else if (y === 'end') {
    if (!await askConfirm({ title: tr('biz.endTitle'), text: tr('biz.endText'), yes: tr('biz.endYes'), no: tr('biz.endNo') })) return;
    if (BAPP.cam) BAPP.cam.stopAll(); BAPP.lastOpen = false;
    const r = await act('venue_open', { open: '0' }); if (r && r.ok) { BAPP.sig = {}; toast(tr('biz.ended')); render(); }
  }
  else if (y === 'printqr') bizPrintQR();
  else if (y === 'evadd') { bizResetEventForm($('#bizEvForm')); $('[data-evform]').hidden = false; $('#evTitle').focus(); }
  else if (y === 'evnew') bizResetEventForm($('#bizEvForm'));
  else if (y === 'evedit') {
    const ev = ((S.state && S.state.events) || []).find(v => v.id === a.dataset.id), f = $('#bizEvForm'); if (!ev || !f) return;
    $('[data-evform]').hidden = false;
    ['title', 'kind', 'gameType', 'date', 'time', 'cap', 'fee', 'prize', 'about'].forEach(k => { f.elements[k].value = k === 'cap' && !ev.cap ? '' : ev[k]; });
    BIZ.editId = ev.id; bizSetKey($('#bizEvTitle'), 'biz.evEdit'); bizSetKey($('#bizEvSave'), 'biz.saveEdit');
    f.elements.title.focus();
  }
  else if (y === 'evdel') {
    const ev = ((S.state && S.state.events) || []).find(v => v.id === a.dataset.id); if (!ev) return;
    if (!await askConfirm({ title: tr('biz.evDelTitle', { title: ev.title }), text: ev.count ? tr('biz.evDelSigned', { n: ev.count }) : tr('biz.evDelEmpty'), yes: tr('biz.evCancelBtn'), no: tr('biz.evDelNo') })) return;
    const r = await act('event_remove', { id: ev.id }); if (r && r.ok) { toast(tr('biz.evCancelled')); if (BIZ.editId === ev.id) bizResetEventForm($('#bizEvForm')); }
  }
});

// ===== web/src/player.js =====
// ===== App shell: which app the address asks for, and the player app =====
// Player flow: scan the bar's QR code -> the bar's page (the wait first, then one button) -> Join the queue (your name,
// the game, optionally an email) -> Home shows your place in line and the wait -> called (the table, the time left, one
// button) -> the game (whose shot, call a foul, ask the referee) -> the result (rating change, play again or stop).
// Nobody is asked for details before they can see the bar: the name is asked at the moment of joining. After the first
// game the player adds a password to keep the rating.
// The address picks the app: #play (also #mobile, which the bar's QR code and the emails open) for players,
// #bar for bars, #tv for the bar TV. A first visit with no address asks who is using the screen.
// Like business.js, this file only uses the page helpers ($, esc, act, S, tr, ...) inside functions.
var PAPP = { tab: 'home', bar: null, from: 'list', ev: null, joinFor: null, joinPick: null, invite: null, acct: null, login: false, geo: null, geoAsked: false, scan: null, sig: {} };
var APP_ICONS = {
  play: '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="11" cy="11" r="3.4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 8.6v4.8" stroke="currentColor" stroke-width="1.4"/></svg>',
  bars: '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M11 20s6.5-6 6.5-11a6.5 6.5 0 0 0-13 0c0 5 6.5 11 6.5 11Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="11" cy="9" r="2.4" fill="currentColor"/></svg>',
  ranks: '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M3 19h16M5.5 19v-6h3v6M9.5 19V7h3v12M13.5 19v-9h3v9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>',
  me: '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="7.5" r="3.8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 19.5c.8-4 3.8-6 7.5-6s6.7 2 7.5 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  star: '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="m11 2.8 2.5 5.2 5.7.8-4.1 4 1 5.6L11 15.7l-5.1 2.7 1-5.6-4.1-4 5.7-.8Z" fill="var(--fill,none)" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>',
  qr: '<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M2 7V2h5M13 2h5v5M18 13v5h-5M7 18H2v-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><rect x="6" y="6" width="8" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>',
};
const backBtn = (act, label) => `<button class="backbtn" data-act="${act}"><span aria-hidden="true">${ICON.back}</span>${esc(label)}</button>`;

// ---------- which app the address asks for ----------
function shellRoute(h) {
  const view = shellView(h); document.body.dataset.app = view; return view;
}
function shellView(h) {
  if (h === 'tv' || h === 'live') return 'live';
  const hp = hashParts();
  if (hp.invite) PAPP.invite = hp.invite;
  if (hp.bar) { PAPP.tab = 'bars'; PAPP.bar = hp.bar; PAPP.from = 'home'; PAPP.ev = null; PAPP.joinFor = null; PAPP.sig = {}; }   // a scanned QR code opens that bar's page
  let role = null;
  if (['play', 'mobile', 'phone', 'player'].includes(h)) role = 'player';
  else if (['bar', 'venue', 'counter', 'business', 'camera'].includes(h)) role = 'biz';
  if (role) { store.set('role', role); return role; }
  const saved = store.get('role', null);
  return saved === 'player' || saved === 'biz' ? saved : 'start';
}
function goRole(role) {
  store.set('role', role);
  PAPP.tab = 'home'; PAPP.bar = null; PAPP.ev = null; PAPP.joinFor = null; PAPP.acct = null; PAPP.sig = {};   // land on the main page
  if (typeof BAPP !== 'undefined') { BAPP.screen = 'home'; BAPP.editing = false; BAPP.sig = {}; }
  if (S.sigs) S.sigs.clear(); const h = role === 'biz' ? '#bar' : role === 'player' ? '#play' : ''; if (location.hash === h || (!h && !location.hash)) route(); else location.hash = h; }

// ---------- the player's details: a name (and maybe an email), kept on this phone; a password once they've played a game ----------
function playerProfile() { return store.get('player', null) || PAPP.mem || null; }
function savePlayerProfile(p) { PAPP.mem = p; store.set('player', p); }
function favs() { return store.get('favs', null) || PAPP.favMem || []; }
function setFavs(list) { PAPP.favMem = list; store.set('favs', list); }
const validEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
async function hashPassword(email, pw) {           // the password never leaves the phone; the server stores this hash
  const text = 'loopool|' + email.trim().toLowerCase() + '|' + pw;
  try { const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)); return Array.from(new Uint8Array(d)).map(b => b.toString(16).padStart(2, '0')).join(''); }
  catch (e) { let h = 2166136261, out = ''; for (let r = 0; r < 4; r++) { for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i) + r; h = Math.imul(h, 16777619); } out += (h >>> 0).toString(16).padStart(8, '0'); } return out + out; }
}
function needsAccount(st) { const P = playerProfile(); return !!(P && !P.account && st.my && (st.my.w + st.my.l) >= 1); }

// ---------- bars, distance and the wait ----------
function bars(st) {
  const v = st.venue || {};
  const list = v.setup ? [Object.assign({}, v, { id: 'home', home: true, events: st.events || [] })] : [];
  return list.concat(st.directory || []);
}
function mapsLink(b) { return b.mapsUrl || 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent([b.name, b.address].filter(Boolean).join(' ')); }
function distKm(b) {
  if (!PAPP.geo || b.lat == null || b.lng == null) return null;
  const R = 6371, rad = x => x * Math.PI / 180, dLat = rad(b.lat - PAPP.geo.lat), dLng = rad(b.lng - PAPP.geo.lng);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(rad(PAPP.geo.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
function distText(b) { const d = distKm(b); return d == null ? '' : d < 1 ? tr('dist.m', { n: Math.round(d * 1000 / 10) * 10 }) : tr('dist.km', { n: d < 10 ? d.toFixed(1) : Math.round(d) }); }
function askLocation() {
  if (PAPP.geoAsked || !navigator.geolocation) return; PAPP.geoAsked = true;
  navigator.geolocation.getCurrentPosition(p => { PAPP.geo = { lat: p.coords.latitude, lng: p.coords.longitude }; PAPP.sig = {}; render(); }, () => { /* no location: no distances */ }, { timeout: 8000, maximumAge: 600000 });
}
// A rough wait for someone joining now, from the live board: the strong line, and one short line under it.
function waitInfo(st) {
  const waiting = st.queue.filter(q => q.status === 'waiting').length;
  const free = st.tables.filter(t => t.status === 'empty' || (t.status === 'waiting' && !t.challenger)).length;
  if (free && !st.queue.length) return { head: tr('wait.freeNow'), more: tr('wait.freeMore') };
  const lefts = st.tables.map(t => t.game && t.game.left).filter(x => x != null);
  const soonest = lefts.length ? Math.min(...lefts) : 12;
  const min = Math.max(1, Math.round(soonest + Math.floor(st.queue.length / Math.max(1, st.tables.length)) * 13));
  return { head: tr('wait.about', { n: min }), more: waiting ? tr('wait.ahead', { n: waiting }) : tr('wait.nobody') };
}
function barTodayLine(b, st) { if (b.home && b.open === false) return tr('p.closedNow'); return bizToday(b, st.now) || ''; }
const tableRow = t => {
  const a = t.champ, b = t.challenger, g = t.game;
  const head = a && b ? esc(a.name) + ' ' + trh('common.vs') + ' ' + esc(b.name) : a ? trh('tile.needs', { name: a.name }) : trh('tile.free');
  const sub = [gname(t.gameType), t.ref || t.camera ? tr('card.camera') : '', g ? (g.minutes ? tr('tile.min', { n: g.minutes }) : tr('tile.started')) : a && b ? tr('tile.checkin') : ''].filter(Boolean).join(' · ');
  return `<div class="row"><span class="n${a ? '' : ' free'}">${tnum(t)}</span><div><b>${head}</b><small>${esc(sub)}</small></div></div>`;
};

// ---------- render ----------
function renderPlayerApp(st) {
  const root = $('#v-player'), tab = PAPP.tab;
  $$('[data-ico]', root).forEach(i => { if (!i.innerHTML) i.innerHTML = APP_ICONS[i.dataset.ico]; });
  $$('[data-act="ptab"]', root).forEach(b => b.setAttribute('aria-current', b.dataset.v === tab ? 'page' : 'false'));
  $$('[data-pt]', root).forEach(el => { el.hidden = el.dataset.pt !== tab; });

  else if (tab === 'me') renderMeTab(el, st);

// Home: your place in line or your game when you have one; otherwise the bar you can join, with the wait first
function renderHome(el, st) {
  const scr = phoneScreen(st), active = scr !== 'none';
  const home = $('[data-home]', el), phone = $('[data-phone]', el), watch = $('[data-watch]', el);
  $('[data-invite]', el).innerHTML = PAPP.invite && !active ? `<div class="invite"><b>${trh('p.invited', { name: PAPP.invite })}</b><span>${trh('p.invitedMore', { bar: st.venue.name })}</span><button class="icobtn" data-act="p-invclose" aria-label="${trh('common.dismiss')}">${ICON.close}</button></div>` : '';
  if (PAPP.acct) { phone.hidden = true; watch.hidden = true; renderAccountSheet(home, st); return; }
  if (active) {

  }

  const sig = JSON.stringify([P, my, st.venue, st.directory && st.directory.length, W, PAPP.geo, needsAccount(st), st.tables.map(t => [t.status, t.champ && t.champ.name, t.challenger && t.challenger.name, t.game && t.game.minutes])]);
  if (PAPP.sig.home === sig) return; PAPP.sig.home = sig;

  home.innerHTML = `<div class="ph">

        <div class="stack tight"><p class="strong">${esc(open ? W.head : tr('p.closedNow'))}</p><p class="lede">${esc(open ? [W.more, distText(mine)].filter(Boolean).join(' · ') : tr('p.closedMore'))}</p></div>
        ${open ? `<button class="cta" data-act="p-join" data-id="home">${trh('p.join')}</button>` : ''}</section>`}
    ${mine ? `<div class="two"><button class="quiet" data-act="p-bar" data-id="home" data-from="home">${trh('p.seeBar')}</button>${open ? `<button class="quiet" data-act="p-scan">${APP_ICONS.qr}${trh('p.scan')}</button>` : `<button class="quiet" data-act="ptab" data-v="bars">${trh('p.allBars')}</button>`}</div>` : `<button class="quiet" data-act="ptab" data-v="bars">${trh('p.allBars')}</button>`}
    ${open ? `<section class="barsec"><span class="label">${trh('p.tablesNow')}</span><div class="rows">${st.tables.map(tableRow).join('')}</div></section>` : ''}
    ${my ? `<section class="barsec"><span class="label">${trh('p.yourRating', { bar: st.venue.name })}</span><div class="stats"><div class="stat"><b>${my.rating}</b><span>${trh('p.points')}</span></div><div class="stat"><b>${esc(ord(my.rank))}</b><span>${trh('p.ofPlayers', { n: my.of })}</span></div><div class="stat"><b>${my.w}–${my.l}</b><span>${trh('p.wonLost')}</span></div></div></section>` : ''}

  </div>`;
}

// Add a password after the first game (or from Me), or log in when the email already has an account
function renderAccountSheet(el, st) {
  const P = playerProfile() || { name: '', email: '' }, sig = 'a' + PAPP.login + JSON.stringify(PAPP.acct);
  if (PAPP.sig.home === sig) return; PAPP.sig.home = sig;
  el.innerHTML = `<div class="ph">
    ${backBtn('p-acctback', tr('common.back'))}
    <div class="stack"><h1 class="h2">${trh(PAPP.login ? 'acct.loginTitle' : 'acct.title')}</h1>
      <p class="lede">${PAPP.login ? trh('acct.loginMore', { email: P.email }) : trh('acct.more')}</p></div>
    <form class="mform" id="acctForm" novalidate>
      ${PAPP.login ? '' : `<div class="field"><label for="aName">${trh('f.name')}</label><input id="aName" type="text" maxlength="24" value="${esc(P.name)}" required></div>`}
      <div class="field"><label for="aEmail">${trh('f.email')}</label><input id="aEmail" type="email" value="${esc(P.email || '')}" autocomplete="email" inputmode="email" required></div>
      <div class="field"><label for="aPw">${trh('f.password')}</label><input id="aPw" type="password" autocomplete="${PAPP.login ? 'current-password' : 'new-password'}" required><small>${trh('f.passwordMore')}</small></div>
      <p class="formerr" role="alert" data-err></p>
      <button class="cta" type="submit">${trh(PAPP.login ? (PAPP.acct && PAPP.acct.then === 'join' ? 'acct.loginJoin' : 'acct.login') : (PAPP.acct && PAPP.acct.then === 'join' ? 'acct.createJoin' : 'acct.create'))}</button>
    </form></div>`;
  $('#acctForm', el).addEventListener('submit', async e => {
    e.preventDefault();
    const err = $('[data-err]', el), email = $('#aEmail', el).value.trim(), pw = $('#aPw', el).value;
    const name = PAPP.login ? P.name : $('#aName', el).value.trim().slice(0, 24);
    if (!name) { err.textContent = tr('err.name'); return; }
    if (!validEmail(email)) { err.textContent = tr('err.email'); return; }
    if (pw.length < 6) { err.textContent = tr('err.password'); return; }
    const hash = await hashPassword(email, pw), wasLogin = PAPP.login;
    const r = await act(wasLogin ? 'account_login' : 'account_create', { name, email, hash }, true);
    if (!r || !r.ok) { if (r && r.code === 409) { PAPP.login = true; PAPP.sig = {}; render(); return; } err.textContent = (r && r.error) || tr('err.saveNow'); return; }
    savePlayerProfile({ name: r.account.name, email: r.account.email, hash, account: true });

    toast(tr(wasLogin ? 'acct.didLogin' : 'acct.didCreate'));
    if (then === 'join') await doJoin(PAPP.acctJoin || {}); else render();
  });
}

// ---------- joining a queue (from Home, a bar's page or "play again") ----------
async function doJoin(o) {
  const st = S.state, P = playerProfile();
  if (!P) return;
  if (needsAccount(st)) { PAPP.acct = { then: 'join' }; PAPP.acctJoin = o; PAPP.login = false; PAPP.tab = 'home'; PAPP.sig = {}; render(); window.scrollTo(0, 0); return; }
  S.ticket = null;
  const r = await act('join', { name: P.name, email: P.email || '', hash: P.hash || undefined, gameType: o.gameType || '8-ball', refOnly: !!o.refOnly && (o.gameType || '8-ball') === '8-ball' }, true);

// ---------- QR scanner: the bar's TV shows a code that opens the bar's page here ----------
async function openScanner() {
  const box = $('[data-scanner]'), video = $('video', box), msg = $('[data-scanmsg]', box);
  box.hidden = false; msg.textContent = tr('scan.point');
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false }); }
  catch (e) { msg.textContent = tr('scan.noCamera'); return; }
  video.srcObject = stream; await video.play().catch(() => {});
  let detect = null;
  if ('BarcodeDetector' in window) { try { const d = new BarcodeDetector({ formats: ['qr_code'] }); detect = async () => { const r = await d.detect(video); return r[0] && r[0].rawValue; }; } catch (e) { detect = null; } }
  if (!detect) {
    if (!window.jsQR) await new Promise(res => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'; s.onload = res; s.onerror = res; document.head.appendChild(s); });
    const c = document.createElement('canvas'), g = c.getContext('2d', { willReadFrequently: true });
    detect = async () => { if (!window.jsQR || !video.videoWidth) return null; c.width = 480; c.height = Math.round(480 * video.videoHeight / video.videoWidth); g.drawImage(video, 0, 0, c.width, c.height); const r = window.jsQR(g.getImageData(0, 0, c.width, c.height).data, c.width, c.height); return r && r.data; };
  }
  PAPP.scan = { stream, on: true };
  const tick = async () => {
    if (!PAPP.scan || !PAPP.scan.on) return;
    let text = null; try { text = await detect(); } catch (e) { text = null; }
    if (text) { closeScanner(); handleScan(text); return; }
    setTimeout(tick, 250);
  };
  tick();
}
function closeScanner() { const box = $('[data-scanner]'); box.hidden = true; if (PAPP.scan) { PAPP.scan.on = false; PAPP.scan.stream.getTracks().forEach(t => t.stop()); PAPP.scan = null; } }
function handleScan(text) {
  let u; try { u = new URL(text, location.href); } catch (e) { toast(tr('scan.notOurs')); return; }
  if (u.origin + u.pathname === location.origin + location.pathname && /bar=|mobile|play/.test(u.hash)) { location.hash = u.hash; return; }
  if (/^https?:$/.test(u.protocol) && /mobile|bar=/.test(u.href)) { location.href = u.href; return; }   // another bar's Loopool page
  toast(tr('scan.notOurs'));
}

  else if (x === 'askclose') $('#askDlg').close();
  else if (x === 'tb-fix') openTools(a.dataset.t);
  else if (x === 'tb-next') { const t = S.state.tables.find(y => y.id === a.dataset.t); const r = await act('next_match', { table: a.dataset.t }); if (r && r.ok) toast(tr('tools.didNext', { table: tname(t) })); }
  else if (x === 'tdclose') closeTools();
  else if (x.startsWith('s-')) staffAct(x.slice(2), a);
});
$('#tableDlg').addEventListener('close', () => { S.toolTable = null; });
window.addEventListener('hashchange', route);
window.addEventListener('resize', () => { if (S.view === 'live' && S.state) fitTV($('#v-live [data-tv]')); if (S.view === 'biz' && S.state) fitTV($('#v-biz [data-tv]')); });   // the TV canvas follows the screen size
// ---------- ask the referee (an AI that knows the house rules and the live board; needs the bar's server) ----------
async function askReferee(q) {
  const log = $('#askLog'), add = (cls, txt) => { const p = document.createElement('p'); p.className = cls; p.textContent = txt; log.appendChild(p); log.scrollTop = log.scrollHeight; return p; };
  add('q', q);
  const p = add('a wait', tr('ask.thinking'));
  try {
    const j = client.remote ? await client.ask(q, S.ticket, ticketKey) : { answer: tr('ask.sample') };
    p.className = 'a'; p.textContent = (j && (j.answer || j.error)) || tr('ask.none');
  } catch (e) { p.className = 'a'; p.textContent = tr('ask.down'); }
  log.scrollTop = log.scrollHeight;
}
$('#askForm').addEventListener('submit', e => { e.preventDefault(); const i = $('#askInput'), q = i.value.trim(); if (!q) return; i.value = ''; askReferee(q.slice(0, 200)); });
function makeQR() {
  try {
    if (!window.QRCode) return;
    const box = document.createElement('div');
    new QRCode(box, { text: location.href.split('#')[0] + '#mobile&bar=home',   // opens this bar's page in the player app
       width: 336, height: 336, colorDark: '#111111', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
    const c = box.querySelector('canvas'); S.qr = c ? c.toDataURL() : '';
  } catch (err) { S.qr = ''; }
}
applyStatic(document);
makeQR();
route();
(async () => { apply(await api('state'), true); })();
// Every poll is a request to the backend, so the page checks gently: every 4 s while something is happening (you're called
// or playing, or the board changed in the last minute), every 20 s when nothing is going on, never while the tab is hidden.
// The sample bar has no network, and its players move on their own clock, so it checks every second.
let lastSig = '', lastChange = Date.now();
const boardSig = r => JSON.stringify([r.queue.map(q => q.ticket + q.status), r.tables.map(t => [t.status, t.game && t.game.status, t.game && t.game.shots && t.game.shots.length, t.champ && t.champ.name, t.challenger && [t.challenger.name, t.challenger.present]]), r.feed[0] && r.feed[0].at]);
function pollDelay() {
  if (!client.remote) return 1000;
  const me = S.state && S.state.me;
  return (me && ['called', 'playing'].includes(me.status)) || Date.now() - lastChange < 60000 ? 4000 : 20000;
}
async function poll() {
  if (!document.hidden && !S.busy) {
    const r = await api('state');
    if (r) { const sig = boardSig(r); if (sig !== lastSig) { lastSig = sig; lastChange = Date.now(); } apply(r, true); }
  }
  setTimeout(poll, pollDelay());
}
setTimeout(poll, pollDelay());
document.addEventListener('visibilitychange', async () => { if (!document.hidden && client.remote && !S.busy) { lastChange = Date.now(); const r = await api('state'); if (r) apply(r, true); } });
setInterval(() => { if (client.remote && S.state && !document.hidden) render(); }, 1000);   // countdowns tick between checks

</script>

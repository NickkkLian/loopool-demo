<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Loopool</title>
<meta name="description" content="Loopool: a fair queue for pool tables and a camera referee for every shot. Join by QR, get called to a table, foul review, ratings and a live screen for the bar TV.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@600;800&family=Gochi+Hand&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* The look: a pool bar at night. The page is the wall; three things on it keep their own material in both themes because
   they are objects, not chrome: the paper queue ticket (amber), the chalkboard with the names of who is waiting (slate),
   and the table you are called to (felt and rail). Everything else is quiet and follows the theme.
   Dark is the default on every screen: a white page glares in a dim bar and on the TV. Light is one tap away, for setting
   up in daylight. Sizes come from one scale (--t-*), spacing from a 4 px grid (--s-*), colour only carries meaning:
   blue = the thing to tap, amber = you / your place, red = a foul or something staff must settle, green = fine / free. */
:root {
  color-scheme: dark;
  --board: #18211e; --board-2: #202b27; --board-3: #2a3833; --tv: #101715; --tray: #0f1614;
  --line: #33423c; --line-2: #40504a; --line-3: #6b7d75;
  --chalk: #eef1ec; --dim: #aab5ae; --faint: #8f9d95;
  --blue: #6aa5ee; --blue-ink: #0c1512; --blue-text: #94c0f5;
  --brass: #e7b24a; --foul: #ff8273; --foul-ink: #2a0d09; --foul-line: #6b2f29; --good: #6fd69a; --ok: #a3e635;
  --ticket: #efc25a; --ticket-ink: #2a1d05;
  --slate: #24332d; --slate-ink: #eef1ec; --slate-dim: #aab5ae; --slate-you: #efc25a;
  --felt: #1f6f4a; --felt-edge: #175c3d; --rail: #5c3d26; --pocket: #0b0f0d; --felt-ink: #e3f3e9;
  --shade: rgba(5, 9, 8, .7); --lift: 0 16px 40px rgba(0, 0, 0, .5);
  --f-sign: "Big Shoulders", "Arial Narrow", "Roboto Condensed", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --f-chalk: "Gochi Hand", "Chalkboard SE", "Kaiti SC", "KaiTi", cursive;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --t-xs: 13px; --t-sm: 15px; --t-md: 17px; --t-lg: 22px; --t-xl: 30px; --t-2xl: 44px; --t-3xl: 72px;
  --t-chalk: 26px; --t-words: 56px;   /* the chalk hand runs small, so names on the board sit between two steps; "Next up" on the ticket is words, not a number */
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 20px; --s-6: 24px; --s-8: 32px;
  --r-1: 6px; --r-2: 10px; --r-3: 14px;
}
:root[data-theme="light"] {
  color-scheme: light;
  --board: #f1f4ee; --board-2: #ffffff; --board-3: #e4e9e1; --tv: #e8ede4; --tray: #dde4db;
  --line: #d6dcd3; --line-2: #c2cbbf; --line-3: #82918a;
  --chalk: #15211c; --dim: #4b5a52; --faint: #5d6c63;
  --blue: #1f5fbf; --blue-ink: #ffffff; --blue-text: #1a55ab;
  --brass: #855700; --foul: #bd2c1c; --foul-ink: #ffffff; --foul-line: #e3aaa2; --good: #18713f; --ok: #4d7c0f;
  --shade: rgba(21, 33, 28, .45); --lift: 0 16px 40px rgba(21, 33, 28, .18);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }   /* hidden always wins over a display rule */
html, body { margin: 0; }
body { background: var(--board); color: var(--chalk); font: var(--t-sm)/1.45 var(--f-body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button, a, input, select, textarea, summary, label { touch-action: manipulation; }   /* no double-tap zoom delay on the things people tap */
html { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--blue-text); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
a { color: var(--blue-text); }
svg { flex: none; }
.num, .hdr, .ticket, .called, .tv { font-variant-numeric: tabular-nums; }
.dim { color: var(--dim); }
.bad { color: var(--foul); }
.sign { font-family: var(--f-sign); font-weight: 800; letter-spacing: .03em; text-transform: uppercase; line-height: 1; }
.chalk { font-family: var(--f-chalk); font-weight: 400; }
.label { font: 600 var(--t-xs)/1.3 var(--f-body); color: var(--dim); }
.label.bad { color: var(--foul); }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(var(--s-4), env(safe-area-inset-left, 0px)); padding-right: max(var(--s-4), env(safe-area-inset-right, 0px)); }
main { padding-block: 0 var(--s-8); }
body[data-app="player"] main { padding-bottom: 0; }
.view { display: none; }
.view.on { display: block; }
.ico { display: inline-flex; }
[data-tools] { display: contents; }

/* every screen's own header: its name, whether changes are saved, theme */
.hdr { display: flex; align-items: center; gap: var(--s-2); min-height: 56px; padding-block: var(--s-2); }
.hdr .mark { display: flex; align-items: center; gap: var(--s-2); margin-right: auto; min-width: 0; color: var(--brass); }
.hdr .mark b { font: 800 var(--t-lg)/1 var(--f-sign); letter-spacing: .05em; text-transform: uppercase; color: var(--chalk); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icobtn { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line-2); background: transparent; color: var(--chalk); font: 600 var(--t-sm)/1 var(--f-body); }
.icobtn:hover { border-color: var(--line-3); }
.chip { flex: 0 1 auto; display: inline-flex; align-items: center; gap: var(--s-2); min-height: 32px; min-width: 0; padding: 0 var(--s-3); border-radius: 16px; border: 1px solid var(--line); background: transparent; color: var(--dim); font: 500 var(--t-xs)/1.2 var(--f-body); text-align: left; }
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip i { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.chip[data-kind="saved"] i, .chip[data-kind="idle"] i { background: var(--good); }
.chip[data-kind="saving"] i { background: var(--brass); }
.chip[data-kind="error"], .chip[data-kind="disk"], .chip[data-kind="refused"], .chip[data-kind="offline"] { color: var(--foul); border-color: var(--foul-line); }
.chip[data-kind="error"] i, .chip[data-kind="disk"] i, .chip[data-kind="refused"] i, .chip[data-kind="offline"] i { background: var(--foul); }
.chip u { flex: none; text-underline-offset: 3px; font-weight: 600; }

/* buttons */
.b { display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2); min-height: 40px; padding: 0 var(--s-3); border-radius: var(--r-1); border: 1px solid var(--line-2); background: transparent; color: var(--chalk); font-weight: 600; font-size: var(--t-sm); text-decoration: none; }
.b:hover { border-color: var(--line-3); }
.b:disabled { opacity: .4; cursor: not-allowed; }
.b.go { background: var(--blue); border-color: var(--blue); color: var(--blue-ink); }
.b.danger { border-color: var(--foul-line); color: var(--foul); }
.b.danger.fill { background: var(--foul); border-color: var(--foul); color: var(--foul-ink); }
.b.big { min-height: 48px; padding: 0 var(--s-5); font-size: var(--t-md); }
.cta { display: flex; align-items: center; justify-content: center; gap: var(--s-2); width: 100%; min-height: 56px; padding: 0 var(--s-4); border-radius: var(--r-2); border: 0; background: var(--blue); color: var(--blue-ink); text-decoration: none; font: 800 var(--t-lg)/1 var(--f-sign); letter-spacing: .04em; text-transform: uppercase; }
.cta.foul { background: var(--foul); color: var(--foul-ink); }
.cta.line { background: transparent; color: var(--chalk); border: 1px solid var(--line-3); }
.cta:disabled { opacity: .45; cursor: not-allowed; }
.quiet { display: flex; align-items: center; justify-content: center; gap: var(--s-2); width: 100%; min-height: 48px; padding: 0 var(--s-3); border-radius: var(--r-2); border: 1px solid var(--line-2); background: transparent; color: var(--chalk); font-weight: 600; font-size: var(--t-sm); }
.quiet:disabled { opacity: .4; cursor: not-allowed; }
.quiet.dangerq { color: var(--foul); border-color: var(--foul-line); }
.backbtn { align-self: flex-start; display: inline-flex; align-items: center; gap: var(--s-1); min-height: 44px; padding: 0 var(--s-3) 0 var(--s-1); margin-left: calc(-1 * var(--s-2)); border: 0; background: none; color: var(--blue-text); font-weight: 600; font-size: var(--t-sm); }
.linkbtn { align-self: center; min-height: 44px; border: 0; background: none; color: var(--blue-text); font-weight: 600; font-size: var(--t-sm); text-decoration: underline; text-underline-offset: 3px; }
.push { margin-top: auto; display: flex; flex-direction: column; gap: var(--s-2); }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-2); }
[data-home] .two .quiet { padding-inline: var(--s-2); font-size: var(--t-xs); white-space: nowrap; }
.badge { display: inline-block; padding: 1px var(--s-2); border-radius: var(--s-1); background: var(--board-3); color: var(--brass); font: 600 var(--t-xs)/1.5 var(--f-body); vertical-align: 1px; }

/* first visit: who is using this screen */
.start { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--s-3); padding-bottom: var(--s-8); }
.start h1 { font: 600 var(--t-lg)/1.2 var(--f-body); margin: var(--s-4) 0 var(--s-1); }
.start-pick { display: flex; flex-direction: column; align-items: flex-start; gap: var(--s-1); width: 100%; padding: var(--s-4) var(--s-5); border-radius: var(--r-3); border: 1px solid var(--line-2); background: var(--board-2); color: var(--chalk); text-align: left; text-decoration: none; }
.start-pick:hover { border-color: var(--blue); }
.start-pick b { font: 800 var(--t-xl)/1 var(--f-sign); letter-spacing: .03em; text-transform: uppercase; }
.start-pick small { font-size: var(--t-sm); color: var(--dim); }

/* player app (phone) */
.papp { max-width: 520px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
.papp-body { flex: 1; }
.papp-tabs { position: sticky; bottom: 0; z-index: 5; display: grid; grid-template-columns: repeat(4, 1fr); margin-inline: calc(-1 * var(--s-4)); background: var(--board-2); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.papp-tabs button { display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 56px; padding: var(--s-2) 0 var(--s-1); border: 0; background: none; color: var(--dim); font: 600 var(--t-xs) var(--f-body); }
.papp-tabs button[aria-current="page"] { color: var(--brass); }
.ph { padding: var(--s-2) var(--s-1) var(--s-6); display: flex; flex-direction: column; gap: var(--s-4); }
.ph-top { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); min-height: 44px; }
.h1 { font: 800 var(--t-2xl)/.95 var(--f-sign); letter-spacing: .01em; text-transform: uppercase; }
.h2 { font: 600 var(--t-lg)/1.2 var(--f-body); }
.lede { font-size: var(--t-sm); color: var(--dim); }
.strong { font-size: var(--t-md); font-weight: 600; }
.stack { display: flex; flex-direction: column; gap: var(--s-2); }
.stack.tight { gap: var(--s-1); }

/* the queue ticket: your place in line is the big print, the stub carries the ticket number */
.ticket { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 96px; border-radius: var(--r-2); background: var(--ticket); color: var(--ticket-ink); }
.ticket .main { display: flex; flex-direction: column; gap: var(--s-1); padding: var(--s-4) var(--s-4) var(--s-4) var(--s-5); min-width: 0; }
.ticket .label { color: var(--ticket-ink); }
.ticket .no { font: 800 var(--t-3xl)/.9 var(--f-sign); letter-spacing: .01em; text-transform: uppercase; }
.ticket .no.words { font-size: var(--t-words); }
.ticket .wait { font-size: var(--t-md); font-weight: 600; }
.ticket .where { font-size: var(--t-sm); }
.ticket .stub { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2px; border-left: 2px dashed rgba(42, 29, 5, .45); padding: 0 var(--s-2); text-align: center; }
.ticket .stub b { font: 800 var(--t-xl)/1 var(--f-sign); }
.ticket .stub span { font-size: var(--t-xs); font-weight: 600; }
.ticket::before, .ticket::after { content: ""; position: absolute; right: 85px; width: 22px; height: 22px; border-radius: 11px; background: var(--board); }
.ticket::before { top: -11px; } .ticket::after { bottom: -11px; }

/* the chalkboard: who is waiting, in order. Slate in both themes */
.board { display: flex; flex-direction: column; gap: var(--s-2); padding: var(--s-3) var(--s-4) var(--s-4); border: 4px solid var(--rail); border-radius: var(--r-1); background: var(--slate); color: var(--slate-ink); }
.board .label { color: var(--slate-dim); }
.board ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: var(--s-1); font: var(--t-chalk)/1.15 var(--f-chalk); }
.board li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 var(--s-3); }
.board li small { font: 500 var(--t-xs) var(--f-body); color: var(--slate-dim); white-space: nowrap; }
.board li.done > span { color: var(--slate-dim); }
.board li.me > span { text-decoration: underline; text-decoration-color: var(--slate-you); text-decoration-thickness: 3px; text-underline-offset: 5px; }
.board li.me small, .board li.done small { color: var(--slate-you); }
.board .empty { font: var(--t-lg) var(--f-chalk); color: var(--slate-dim); }
.board .more { font: 500 var(--t-xs) var(--f-body); color: var(--slate-dim); }

/* your table is ready: the table itself, with the time left and the one thing to tap */
.called { display: flex; flex-direction: column; gap: var(--s-2); padding: var(--s-5); border: 6px solid var(--rail); border-radius: var(--r-3); background: var(--felt); color: #fff; }
.called .label { color: var(--felt-ink); font-size: var(--t-sm); }
.called .big { font: 800 var(--t-3xl)/.9 var(--f-sign); text-transform: uppercase; }
.called .count { display: flex; align-items: baseline; gap: var(--s-2); }
.called .count b { font: 800 var(--t-2xl)/1 var(--f-sign); }
.called .count span { font-size: var(--t-sm); color: var(--felt-ink); }
.called .cta { margin-top: var(--s-2); background: #fff; color: #10301f; }
.floor { position: relative; height: 112px; border-radius: var(--r-2); background: var(--board-2); border: 1px solid var(--line); }
.floor .counter { position: absolute; left: var(--s-3); right: var(--s-3); top: var(--s-2); height: 18px; border-radius: 3px; background: var(--board-3); font: 600 var(--t-xs)/18px var(--f-body); color: var(--dim); text-align: center; }
.ft { position: absolute; width: calc(50% - 20px); height: 32px; border-radius: var(--r-1); border: 3px solid var(--rail); background: var(--felt); color: #fff; display: flex; align-items: center; gap: var(--s-2); padding: 0 var(--s-2); }
.ft b { font: 800 var(--t-md)/1 var(--f-sign); white-space: nowrap; }
.ft.dimmed { background: var(--board-3); border-color: var(--line-2); color: var(--dim); }   /* the other tables: there, but quiet */
.ft.you { box-shadow: 0 0 0 3px var(--ticket); }
.ft.a { left: 14px; top: 30px; } .ft.b2 { left: 14px; top: 70px; } .ft.c { right: 14px; top: 30px; } .ft.d { right: 14px; top: 70px; }

/* lists: one strong line and one short line under it, sized to what they hold */
.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: var(--s-3); min-height: 52px; padding: var(--s-2) 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row .n { flex: none; width: 28px; font: 800 var(--t-xl)/1 var(--f-sign); color: var(--dim); }
.row .n.free { color: var(--good); }
.row b { display: block; font-size: var(--t-md); font-weight: 600; }
.row small { display: block; font-size: var(--t-xs); color: var(--dim); }
.stats { display: flex; flex-wrap: wrap; gap: var(--s-2) var(--s-6); }
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat b { font: 800 var(--t-xl)/1 var(--f-sign); letter-spacing: .01em; }
.stat span { font-size: var(--t-xs); color: var(--dim); }
.results { display: flex; flex-direction: column; }
.results div { padding: var(--s-2) 0; border-bottom: 1px solid var(--line); font-size: var(--t-sm); }
.results div:last-child { border-bottom: 0; }
.results small { margin-left: var(--s-2); font-size: var(--t-xs); color: var(--dim); white-space: nowrap; }

/* forms */
.field { display: flex; flex-direction: column; gap: var(--s-2); }
.field label, .field legend { font-size: var(--t-sm); font-weight: 600; padding: 0; }
.field input { height: 52px; padding: 0 var(--s-3); border-radius: var(--r-2); border: 1px solid var(--line-3); background: var(--board-2); color: var(--chalk); font-size: var(--t-md); }
.field input::placeholder { color: var(--faint); }
.field small { font-size: var(--t-xs); color: var(--dim); }
fieldset { margin: 0; padding: 0; border: 0; }
.seg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-2); }
.seg button { height: 48px; border-radius: var(--r-2); border: 2px solid var(--line-2); background: transparent; font: 800 var(--t-lg)/1 var(--f-sign); letter-spacing: .04em; text-transform: uppercase; }
.seg button[aria-pressed="true"] { background: var(--chalk); border-color: var(--chalk); color: var(--board); }
.switch { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s-3); align-items: center; padding: var(--s-3); border-radius: var(--r-2); border: 1px solid var(--line-2); cursor: pointer; }
.switch b { display: block; font-size: var(--t-sm); font-weight: 600; }
.switch small { display: block; font-size: var(--t-xs); color: var(--dim); margin-top: 2px; }
.switch .knob { position: relative; width: 52px; height: 32px; }
.switch input { position: absolute; inset: 0; width: 52px; height: 32px; margin: 0; opacity: 0; cursor: pointer; }
.switch .knob i { position: absolute; inset: 0; border-radius: 16px; background: var(--board-3); border: 1px solid var(--line-3); transition: background-color .15s; }
.switch .knob i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 12px; background: var(--dim); transition: transform .15s, background-color .15s; }
.switch input:checked + i { background: var(--blue); border-color: var(--blue); }
.switch input:checked + i::after { transform: translateX(20px); background: var(--blue-ink); }
.switch input:disabled + i { opacity: .4; }
.switch input:focus-visible + i { outline: 2px solid var(--blue-text); outline-offset: 2px; }
.mform { display: flex; flex-direction: column; gap: var(--s-4); }
.formerr { color: var(--foul); font-size: var(--t-sm); }
.formerr:empty { display: none; }
.joinbox { display: flex; flex-direction: column; gap: var(--s-3); padding: var(--s-4); border-radius: var(--r-3); border: 1px solid var(--blue); background: var(--board-2); }
.notice { display: flex; flex-direction: column; gap: var(--s-1); padding: var(--s-3) var(--s-4); border-radius: var(--r-2); border: 1px solid var(--brass); background: var(--board-2); font-size: var(--t-sm); }
.notice .b { align-self: flex-start; margin-top: var(--s-2); }
.invite { position: relative; padding: var(--s-3) 48px var(--s-3) var(--s-4); border-radius: var(--r-2); border: 1px solid var(--brass); background: var(--board-2); display: flex; flex-direction: column; gap: 2px; font-size: var(--t-sm); margin-top: var(--s-2); }
.invite .icobtn { position: absolute; right: var(--s-1); top: var(--s-1); border: 0; }

/* in a game */
.turnline { display: flex; flex-direction: column; gap: 2px; padding: var(--s-3) var(--s-4); border-radius: var(--r-2); background: var(--board-2); border-left: 4px solid var(--line-3); }
.turnline.mine { border-left-color: var(--blue); }
.turnline b { font: 800 var(--t-xl)/1 var(--f-sign); text-transform: uppercase; letter-spacing: .02em; }
.turnline span { font-size: var(--t-sm); color: var(--dim); }
.player { display: flex; align-items: center; flex-wrap: wrap; gap: var(--s-2) var(--s-3); padding: var(--s-2) var(--s-3); border-radius: var(--r-2); background: var(--board-2); }
.player.turn { box-shadow: inset 0 0 0 2px var(--blue); }
.player .who { font-size: var(--t-md); font-weight: 600; }
.player .who small { font-size: var(--t-xs); font-weight: 400; color: var(--dim); margin-left: var(--s-1); }
.tray { display: flex; gap: var(--s-1); align-items: center; min-height: 30px; padding: 0 var(--s-2); border-radius: 15px; background: var(--tray); box-shadow: inset 0 2px 5px rgba(0, 0, 0, .35); }
.tray .open { font-size: var(--t-xs); color: var(--dim); padding: 0 var(--s-1); }

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// ===== shared/engine.js =====
// ===== Loopool rules engine =====
// One copy of the rules, used by the server (server/) and by the page's local mode (web/). No I/O, no clock of its own,
// no platform APIs: every function takes the state and the time it needs and returns the new state.
//
//   createState(now)                      an empty venue: four tables, no players, no queue
//   handle(state, action, params, now)    one request. Returns { state, response, notify, finished }
//                                         `state` is a new object (the input is not changed), `response` is what the apps
//                                         read, `notify` are messages for players (see server/emails.js), `finished` lists
//                                         games that ended during this call.
//
// Everything the engine knows lives in `state`: tables, the queue, players and ratings, the bar profile and events,
// accounts, recent results and the activity feed.
// sim* values only matter for simulated players (the sample data of local mode): how fast they check in, vote and confirm.
const RULES = { maxWins: 3, checkinSec: 180, simCheckinSec: 40, simVoteSec: 3, simConfirmSec: 3, avgGameMin: { '8-ball': 14, '9-ball': 11, '10-ball': 12 }, k: 32, startRating: 1200, games: ['8-ball', '9-ball', '10-ball'], aiReviewBelow: 0.6, undoDepth: 8 };
// Balls on the table at the start of each game type.
const BALLS = gt => Array.from({ length: gt === '9-ball' ? 9 : gt === '10-ball' ? 10 : 15 }, (_, i) => i + 1);
const TABLE = { W: 1000, H: 500, R: 11, pockets: [[0, 0], [500, -6], [1000, 0], [0, 500], [500, 506], [1000, 500]] };
const MIN = 60000;
// A table has a camera while a camera page is running for it: the page names its tables on every state poll
// (?cams=T1,T2), so a camera counts as gone once it has not reported for CAM_TTL. Table 1 (t.ref) always has one.
const CAM_TTL = MIN, CAM_SAVE_EVERY = 20000;
function camOn(t, now) { return !!t.camAt && now - t.camAt < CAM_TTL; }
function refereed(t, now) { return !!t.ref || camOn(t, now); }
function groupOf(b) { b = Number(b); return b === 8 ? 'eight' : b < 8 ? 'solids' : 'stripes'; }
function otherSide(s) { return s === 'champ' ? 'challenger' : 'champ'; }
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function clone(o) { return JSON.parse(JSON.stringify(o)); }

function rackPositions() {
  const R = TABLE.R, rows = [[1], [10, 2], [3, 8, 11], [12, 5, 13, 4], [6, 14, 7, 15, 9]];
  const pos = { cue: [250, 250] };
  rows.forEach((row, i) => row.forEach((b, j) => { pos[b] = [Math.round(750 + i * (2 * R * 0.87 + 0.6)), Math.round(250 + (j - i / 2) * (2 * R + 0.8))]; }));
  return pos;
}

// An empty venue. Tables are fixed at four for now; Table 1 is the camera table and its games are rated.
function createState(now) {
  const table = (id, n, ref, gameType) => ({ id, name: 'Table ' + n, ref, gameType, champ: null, challenger: null, streak: 0, game: null });
  return {
    v: 1, seq: 101, createdAt: now,
    venue: venueProfile({ name: 'New bar', open: false, setup: false }, 4),
    events: [],
    directory: [],
    players: {},
    tables: [table('T1', 1, true, '8-ball'), table('T2', 2, false, '9-ball'), table('T3', 3, false, '8-ball'), table('T4', 4, false, '9-ball')],
    queue: [],
    history: [],
    feed: [],
    outbox: [],
    accounts: {},
  };
}

function log(S, now, kind, text, ref) { S.feed.push(Object.assign({ at: now, kind, text }, ref || {})); if (S.feed.length > 40) S.feed.splice(0, S.feed.length - 40); }
// A message to one player. It goes in `notify` when the player gave an address, and the backend emails it (server/emails.js).
// Buttons and "Open my ticket" become keyed links back to the app, so players can act or open their own view from the email.
// The key is per ticket and never leaves the server except inside that player's own emails.
const LINK_ACTIONS = ['checkin', 'vote', 'confirm', 'leave'];
function actLink(S, q, action, vote) { return (S.base || '') + '/api/act?a=' + action + '&t=' + encodeURIComponent(q.ticket) + '&k=' + q.key + (vote ? '&v=' + vote : ''); }
function text(S, now, ticket, msg, notes, opts) {
  const q = S.queue.find(x => x.ticket === ticket); if (!q || !q.real) return;
  opts = opts || {};
  const n = { at: now, ticket, name: q.name, email: q.email || '', subject: opts.subject || msg, text: msg,
    buttons: (opts.buttons || []).map(b => ({ label: b[0], url: actLink(S, q, b[1], b[2]), style: b[3] || '' })),
    page: (S.base || '') + '/#mobile&t=' + encodeURIComponent(q.ticket) + '&k=' + encodeURIComponent(q.key) };
  S.outbox.push({ at: n.at, ticket, text: msg }); if (S.outbox.length > 40) S.outbox.splice(0, S.outbox.length - 40);
  if (q.email) notes.push(n);
}
function textSeats(S, t, now, notes, msgFor, opts) {
  ['champ', 'challenger'].forEach(side => { const s = t[side]; if (s && s.ticket) text(S, now, s.ticket, msgFor(side), notes, typeof opts === 'function' ? opts(side) : opts); });
}
function eligible(q, t) { return q.status === 'waiting' && q.gameType === t.gameType && (!q.refOnly || t.ref); }
function seatFromTicket(q, now) { return { pid: q.pid, name: q.name, ticket: q.ticket, real: !!q.real, present: false, calledAt: now }; }

// Player stats (shots scored by the AI, fouls, best shot) for the leaderboard and badges.
function stat(S, pid) { const p = S.players[pid]; if (!p) return null; if (p.shots == null) Object.assign(p, { shots: 0, scoreSum: 0, fouls: 0, best: 0 }); return p; }
function findPid(S, name, create) {
  const n = String(name || '').trim().replace(/\s+/g, ' ').slice(0, 24); if (!n) return null;
  let pid = Object.keys(S.players).find(k => S.players[k].name.toLowerCase() === n.toLowerCase());
  if (!pid && create) { pid = 'p_' + n.toLowerCase().replace(/[^a-z0-9]+/g, '') + '_' + (++S.seq); S.players[pid] = { name: n, rating: RULES.startRating, w: 0, l: 0 }; }
  return pid;
}
// Rating change: Elo with K = 48 for a player's first 5 matches, then 32, times a margin
// multiplier (1 + 0.05 x balls the loser still had), plus up to +-5 from the player's average AI shot score this game.
function ratingChange(S, g, W, L, loserLeft) {
  const pw = S.players[W.pid], pl = S.players[L.pid];
  const E = 1 / (1 + Math.pow(10, (pl.rating - pw.rating) / 400));
  const mult = 1 + 0.05 * Math.max(0, Math.min(7, loserLeft || 0));
  const perf = side => { const ss = (g.shots || []).filter(s => s.side === side && s.score != null); return ss.length ? ss.reduce((a, s) => a + s.score, 0) / ss.length : 50; };
  const bonus = v => Math.max(-5, Math.min(5, (v - 50) / 10));
  const K = p => ((p.w || 0) + (p.l || 0)) < 5 ? 48 : 32;
  return { dW: Math.round(K(pw) * (1 - E) * mult + bonus(perf(W.side))), dL: Math.round(-K(pl) * (1 - E) * mult + bonus(perf(L.side))) };
}

function startGame(S, t, now) {
  const real = t.champ.real || t.challenger.real || t.champ.staff || t.challenger.staff;   // staff-started matches are played for real too
  const mode = refereed(t, now) && real ? 'camera' : real ? 'manual' : 'sim';   // any table with a running camera is refereed; only Table 1 is rated
  const id = 'g' + (++S.seq);
  const g = { id, mode, rated: t.ref, startedAt: now, status: 'live' };
  if (mode === 'sim') {
    const h = hashStr(t.champ.pid + t.challenger.pid + id);
    g.endsAt = now + (RULES.avgGameMin[t.gameType] - 3 + (h % 7)) * MIN;
    const rc = (S.players[t.champ.pid] || {}).rating || 1200, rh = (S.players[t.challenger.pid] || {}).rating || 1200;
    g.simWinner = (h % 100) < 100 / (1 + Math.pow(10, (rh - rc) / 400)) ? 'champ' : 'challenger';
  }
  if (mode === 'camera') {
    Object.assign(g, { gameType: t.gameType, turn: t.breaker || 'challenger', groups: { champ: null, challenger: null }, onTable: BALLS(t.gameType), positions: t.gameType === '8-ball' ? rackPositions() : null, lastShot: null, shots: [], review: null, ballInHand: false, winner: null, confirm: {} });
  }
  if (mode === 'manual') Object.assign(g, { winner: null, confirm: {} });
  t.game = g; delete t.breaker;
  [t.champ, t.challenger].forEach(s => { const q = S.queue.find(x => x.ticket === s.ticket); if (q) q.status = 'playing'; });
  log(S, now, 'table', t.champ.name + ' vs ' + t.challenger.name + ' started on ' + t.name + (mode === 'camera' ? ' (camera referee)' : ''));
}

function finishGame(S, t, winSide, now, notes, reason) {
  const g = t.game, W = Object.assign({ side: winSide }, t[winSide]), L = Object.assign({ side: otherSide(winSide) }, t[otherSide(winSide)]);
  let delta = 0, lossDelta = 0;
  if (g.rated && S.players[W.pid] && S.players[L.pid]) {
    const lg = g.groups && g.groups[L.side];
    const loserLeft = g.mode === 'camera' && (g.gameType || t.gameType) === '8-ball' ? (lg ? g.onTable.filter(b => groupOf(b) === lg).length : 7) : 0;
    const r = ratingChange(S, g, W, L, loserLeft);
    delta = r.dW; lossDelta = r.dL;
    S.players[W.pid].rating += delta; S.players[L.pid].rating += lossDelta; S.players[W.pid].w++; S.players[L.pid].l++;
  }
  S.finished = (S.finished || 0) + 1;
  S.history.unshift({ at: now, table: t.name, winner: W.name, loser: L.name, rated: g.rated, delta, lossDelta, reason: reason || '' });
  if (S.history.length > 20) S.history.length = 20;
  t.streak = winSide === 'champ' ? t.streak + 1 : 1;
  log(S, now, 'result', W.name + ' beat ' + L.name + ' on ' + t.name + (g.rated ? ' (+' + delta + ' rating)' : '') + (reason ? ' · ' + reason : ''));
  const lq = S.queue.find(x => x.ticket === L.ticket);
  if (lq) { lq.status = 'done'; lq.result = { won: false, gameId: g.id, opponent: W.name, delta: lossDelta, rated: g.rated, rating: (S.players[L.pid] || {}).rating, table: t.name }; text(S, now, lq.ticket, 'Good game! ' + W.name + ' won on ' + t.name + (g.rated ? ' (' + lossDelta + ' rating)' : '') + '. Want another? Put your name back on the board.', notes, { subject: 'Good game on ' + t.name }); }
  const wq = S.queue.find(x => x.ticket === W.ticket);
  if (wq) { wq.result = { won: true, gameId: g.id, opponent: L.name, delta, rated: g.rated, rating: (S.players[W.pid] || {}).rating, table: t.name, streak: t.streak, stayOn: true }; text(S, now, wq.ticket, 'You beat ' + L.name + ' on ' + t.name + (g.rated ? ' (+' + delta + ' rating, now ' + wq.result.rating + ')' : '') + '. Winner stays on, so the table is yours for the next game.', notes, { subject: 'You won on ' + t.name }); }
  t.champ = Object.assign({}, W, { present: true });
  t.challenger = null; t.lastGame = { id: g.id, winner: W.name, loser: L.name, at: now };
  t.game = null;
  const waiting = S.queue.some(q => eligible(q, t));
  if (t.streak >= RULES.maxWins && waiting) {
    log(S, now, 'table', W.name + ' won ' + t.streak + ' in a row and hands over ' + t.name + ' (house rule: max ' + RULES.maxWins + ')');
    if (wq) { wq.status = 'done'; wq.result.stayOn = false; wq.result.retired = true; text(S, now, wq.ticket, 'You won ' + t.streak + ' in a row. House rule: the table goes to the next players now. Nice run!', notes); }
    t.champ = null; t.streak = 0;
  }
}

function resolveReview(S, t, decision, now, by) {
  const g = t.game, r = g.review; if (!r) return;
  const shot = g.shots.find(s => s.no === r.shotNo);
  if (decision === 'foul') {
    g.turn = r.ifFoul; g.ballInHand = true;
    if (shot) { shot.fouls.push(r.foul.text + ' (confirmed' + (by ? ' by ' + by : '') + ')'); shot.possible = []; }
    log(S, now, 'foul', 'Foul confirmed on shot ' + r.shotNo + ': ' + r.foul.text + '. ' + t[r.ifFoul].name + ' has ball in hand');
  } else {
    g.turn = r.ifClean;
    if (shot) { shot.possible = []; shot.cleared = true; }
    log(S, now, 'foul', 'No foul on shot ' + r.shotNo + (by ? ' (' + by + ')' : '') + '. ' + t[r.ifClean].name + ' to shoot');
  }
  g.status = 'live'; g.review = null;
}

function settle(S, now, notes) {
  for (let guard = 0, changed = true; changed && guard < 30; guard++) {
    changed = false;
    for (const t of S.tables) {
      const g = t.game;
      if (g && g.mode === 'sim' && g.endsAt <= now) { finishGame(S, t, g.simWinner, now, notes); changed = true; continue; }
      if (g && g.status === 'review' && g.review) {
        for (const side of ['champ', 'challenger']) {
          if (!t[side].real && !t[side].staff && !g.review.votes[side] && now - g.review.at >= RULES.simVoteSec * 1000) {
            g.review.votes[side] = g.review.source === 'player' && g.review.accused === side ? 'dispute' : 'accept';
            log(S, now, 'foul', t[side].name + (g.review.votes[side] === 'accept' ? ' accepted' : ' disputed') + ' the foul call');
            changed = true;
          }
        }
        const v = g.review.votes;
        if (v.champ && v.challenger && !g.review.staff) {
          if (v.champ === v.challenger) resolveReview(S, t, v.champ === 'accept' ? 'foul' : 'clean', now, 'both players');
          else { g.review.staff = true; log(S, now, 'staff', 'Players disagree on shot ' + g.review.shotNo + ' on ' + t.name + '. Staff decision needed', { table: t.id, game: g.id, shot: g.review.shotNo }); }   // the counter tablet shows this in red until staff decide
          changed = true;
        }
      }
      if (g && g.status === 'confirm') {
        for (const side of ['champ', 'challenger']) {
          if (!t[side].real && !g.confirm[side] && now - g.confirmAt >= RULES.simConfirmSec * 1000) { g.confirm[side] = true; changed = true; }
        }
        if (g.confirm.champ && g.confirm.challenger) { finishGame(S, t, g.winner, now, notes, g.winReason); changed = true; continue; }
      }
      if (!t.game) {
        for (const side of ['champ', 'challenger']) {
          const s = t[side];
          if (!s) continue;
          if (!s.present && !s.real && now - s.calledAt >= RULES.simCheckinSec * 1000) { s.present = true; log(S, now, 'queue', s.name + ' checked in at ' + t.name); changed = true; }
          if (!s.present && s.real && now - s.calledAt >= RULES.checkinSec * 1000) {
            const q = S.queue.find(x => x.ticket === s.ticket);
            if (q) { q.status = 'missed'; text(S, now, q.ticket, 'You missed your turn at ' + t.name + ', so the next name on the board was called. Put your name back on the board any time.', notes, { subject: 'You missed your turn at ' + t.name }); }
            log(S, now, 'queue', s.name + ' missed the check-in for ' + t.name);
            t[side] = null; changed = true;
          }
        }
        if (!t.champ && t.challenger) { t.champ = t.challenger; t.challenger = null; t.streak = 0; changed = true; }
        const called = [];
        for (const side of ['champ', 'challenger']) {
          if (t[side]) continue;
          const q = S.queue.find(x => eligible(x, t));
          if (!q) break;
          q.status = 'called'; q.table = t.id; q.calledAt = now; q.seat = side;
          t[side] = seatFromTicket(q, now);
          log(S, now, 'queue', q.name + ' was called to ' + t.name);
          called.push([q, side]);
          changed = true;
        }
        called.splice(0).forEach(([q, side]) => {   // after both seats are filled, so the email can name the opponent
          const opp = t[side === 'champ' ? 'challenger' : 'champ'];
          text(S, now, q.ticket, 'It\'s your turn! Go to ' + t.name + (opp ? ' to play ' + opp.name : '') + '. Check in within ' + Math.round(RULES.checkinSec / 60) + ' minutes, or your spot goes to the next name on the board.', notes, { subject: 'Your table is ready: ' + t.name + (opp ? ' vs ' + opp.name : ''), buttons: [['I\'m at the table', 'checkin']] });
        });
        if (t.champ && t.challenger && t.champ.present && t.challenger.present) { startGame(S, t, now); changed = true; }
      }
    }
  }
}

function applyShot(S, t, ev, now, notes) {
  notes = notes || [];
  const g = t.game;
  if (!g || g.mode !== 'camera') return 'The camera is not following a game on ' + t.name + ' right now.';
  if (g.status === 'review') return 'Waiting for the foul review on shot ' + g.review.shotNo + '.';
  if (g.status !== 'live') return 'This game is over.';
  const gt = g.gameType || t.gameType || '8-ball', eightBall = gt === '8-ball';
  const side = g.turn, other = otherSide(side), nm = s => t[s].name;
  const before = g.onTable.slice();
  let potted = (ev.potted || []).map(Number).filter(b => before.includes(b));
  const mine = eightBall ? g.groups[side] : null;
  const leftBefore = mine ? before.filter(b => groupOf(b) === mine).length : null;
  const fouls = [], possible = [];
  const ai = ev.ai || null;                                   // the AI's reading of the shot photos
  const reviewBelow = ai ? RULES.aiReviewBelow : 0.8;
  const fcUnknown = ev.firstContact === 'unknown';            // the photos don't show which ball was hit first
  const fc = fcUnknown || ev.firstContact == null || ev.firstContact === '' ? null : Number(ev.firstContact);
  const isBreak = g.shots.length === 0;
  if (fc == null && !fcUnknown) fouls.push({ code: 'no-contact', text: 'Cue ball didn\'t hit any ball' });
  if (ev.cueBallPotted) fouls.push({ code: 'scratch', text: 'Scratch: the cue ball went in a pocket' });
  if (eightBall && fc != null && !isBreak) {                  // on the break any ball may be hit first
    const legal = mine ? (leftBefore > 0 ? groupOf(fc) === mine : fc === 8) : fc !== 8;
    if (!legal) {
      const conf = ev.confidence && ev.confidence.firstContact != null ? Number(ev.confidence.firstContact) : 0.95;
      (conf < reviewBelow ? possible : fouls).push({ code: 'wrong-ball', text: nm(side) + ' hit the ' + fc + ' first', conf });
    }
  }
  if (ai && ai.foul && !fouls.length && !possible.length) {  // a foul only the AI saw in the photos
    const conf = ai.confidence == null ? 0.95 : Number(ai.confidence);
    (conf < reviewBelow ? possible : fouls).push({ code: 'ai', text: ai.foulReason || 'Foul seen by the AI referee', conf });
  }
  const money = gt === '9-ball' ? 9 : gt === '10-ball' ? 10 : 8;
  const respot = !eightBall && potted.includes(money) && (fouls.length || possible.length);
  if (respot) potted = potted.filter(b => b !== money);       // 9/10-ball: the money ball potted on a foul comes back
  g.onTable = before.filter(b => !potted.includes(b));
  const from = g.positions;
  g.positions = ev.positions || (ai ? null : g.positions);    // the AI method sends photos, not ball positions
  g.lastShot = { no: g.shots.length + 1, cuePath: ev.cuePath || null, pockets: ev.pockets || {}, from };
  const shot = { no: g.shots.length + 1, side, shooter: nm(side), potted, firstContact: fc, scratch: !!ev.cueBallPotted, fouls: fouls.map(f => f.text), possible: possible.map(f => f.text + ' (' + Math.round(f.conf * 100) + '% sure)'), at: now, clip: ev.clip ? String(ev.clip).slice(0, 60) : null };
  if (ai) Object.assign(shot, { score: ai.score, grade: ai.grade, tip: ai.tip || '', observations: ai.observations || '', breakdown: ai.breakdown || null, confidence: ai.confidence, needsReview: !!ai.needsReview, ai: ai.observations ? String(ai.observations).slice(0, 240) : null });
  const lines = [];
  const confirmFlow = (winner, why) => {
    g.winner = winner; g.winReason = why; g.status = 'confirm'; g.confirmAt = now; g.confirm = {}; g.turn = null;
    lines.push('Shot ' + shot.no + ': ' + why + '. ' + nm(winner) + ' wins! Waiting for both players to confirm.');
    textSeats(S, t, now, notes, s => why + '. ' + (s === winner ? 'You win!' : nm(winner) + ' wins.') + ' Confirm the result so the ratings update.', { subject: 'Game over on ' + t.name + ': please confirm', buttons: [['Confirm result', 'confirm']] });
  };
  if (eightBall && potted.includes(8) && !isBreak) {
    const cleared = mine && leftBefore === 0;
    const ok = cleared && !fouls.length && !possible.length;
    confirmFlow(ok ? side : other, ok ? nm(side) + ' potted the 8' : (cleared ? nm(side) + ' fouled on the 8' : nm(side) + ' potted the 8 too early'));
  } else if (!eightBall && potted.includes(money)) {
    confirmFlow(side, nm(side) + ' potted the ' + money);
  } else {
    if (eightBall && !mine && !fouls.length && !possible.length && potted.length && !isBreak) {
      // open table: the first legal pot after the break sets the groups (majority if both kinds went down)
      const s1 = potted.filter(b => groupOf(b) === 'solids').length, s2 = potted.filter(b => groupOf(b) === 'stripes').length;
      if (s1 || s2) { const grp = s1 >= s2 ? 'solids' : 'stripes'; g.groups[side] = grp; g.groups[other] = grp === 'solids' ? 'stripes' : 'solids'; shot.note = nm(side) + ' takes ' + grp; lines.push(nm(side) + ' takes ' + grp); }
    }
    const own = eightBall ? (g.groups[side] ? potted.some(b => groupOf(b) === g.groups[side]) : potted.length > 0) : potted.length > 0;
    const desc = 'Shot ' + shot.no + ' · ' + nm(side) + (potted.length ? ' potted ' + potted.join(' and ') : ' missed') + (respot ? ' (the ' + money + ' comes back on a foul)' : '');
    if (possible.length) {
      g.status = 'review';
      g.review = { shotNo: shot.no, side, accused: side, source: 'ai', foul: possible[0], threshold: reviewBelow, ball: fc, clip: shot.clip, votes: {}, at: now, staff: false, ifFoul: other, ifClean: own && !fouls.length ? side : other, replay: { from, to: g.positions, cuePath: g.lastShot.cuePath, pockets: g.lastShot.pockets, highlight: fc } };
      g.turn = null;
      lines.unshift(desc);
      lines.push('Possible foul: ' + possible[0].text + ' (' + Math.round(possible[0].conf * 100) + '% sure). Play paused for review.');
      textSeats(S, t, now, notes, () => 'Possible foul on shot ' + shot.no + ': ' + possible[0].text + ' (the camera is ' + Math.round(possible[0].conf * 100) + '% sure). Play is paused until you both decide. ' + (ai ? 'Open your ticket to see the camera photo' : 'Watch the replay on your phone') + ', or answer here.', { subject: 'Possible foul on ' + t.name + ', shot ' + shot.no, buttons: [['Foul', 'vote', 'accept', 'foul'], ['No foul', 'vote', 'dispute']] });
    } else if (fouls.length) {
      g.turn = other; g.ballInHand = true;
      lines.unshift(desc);
      lines.push('Foul: ' + fouls.map(f => f.text).join(', ') + '. ' + nm(other) + ' has ball in hand.');
    } else {
      g.turn = own ? side : other; g.ballInHand = false;
      lines.unshift(desc + (own ? '. Still shooting' : '. ' + nm(other) + ' to shoot'));
    }
  }
  shot.reason = lines.join(' · ');
  g.lastReason = shot.reason;
  g.shots.push(shot);
  if (ai && ai.score != null) { const st = stat(S, t[side].pid); if (st) { st.shots++; st.scoreSum += Number(ai.score) || 0; st.best = Math.max(st.best, Number(ai.score) || 0); if (fouls.length) st.fouls++; } }
  lines.forEach(l => log(S, now, possible.length || fouls.length ? 'foul' : 'shot', t.name + ' · ' + l));
  if (shot.ai) log(S, now, 'ai', t.name + ' · ' + shot.ai);
  return null;
}

function findTicket(S, ticket) { return S.queue.find(q => q.ticket === ticket); }
function tableOf(S, q) { return q && q.table ? S.tables.find(t => t.id === q.table) : null; }
function sideOf(t, q) { if (!t || !q) return null; if (t.champ && t.champ.ticket === q.ticket) return 'champ'; if (t.challenger && t.challenger.ticket === q.ticket) return 'challenger'; return null; }

function etas(S, now) {
  const free = {};
  S.tables.forEach(t => {
    const avg = RULES.avgGameMin[t.gameType] * MIN;
    if (t.game) free[t.id] = t.game.mode === 'sim' ? t.game.endsAt : Math.max(now + 2 * MIN, t.game.startedAt + avg);
    else free[t.id] = t.champ && t.challenger ? now + 2 * MIN : now;
  });
  const out = {};
  S.queue.filter(q => q.status === 'waiting').forEach(q => {
    const cands = S.tables.filter(t => t.gameType === q.gameType && (!q.refOnly || t.ref));
    if (!cands.length) { out[q.ticket] = null; return; }
    let best = cands[0]; cands.forEach(t => { if (free[t.id] < free[best.id]) best = t; });
    out[q.ticket] = { min: Math.max(0, Math.round((free[best.id] - now) / MIN)), table: best.name };
    free[best.id] += RULES.avgGameMin[best.gameType] * MIN;
  });
  return out;
}

function publicState(S, now, ticket, player) {
  const E = etas(S, now);
  const rating = pid => (S.players[pid] || {}).rating || RULES.startRating;
  const seatPub = (s, t, side) => s ? { name: s.name, rating: rating(s.pid), present: !!s.present, real: !!s.real, ticket: s.ticket ? s.ticket : null, checkinLeft: !s.present && s.calledAt ? Math.max(0, Math.round(((s.real ? RULES.checkinSec : RULES.simCheckinSec) * 1000 - (now - s.calledAt)) / 1000)) : null, streak: side === 'champ' ? t.streak : 0 } : null;
  const tables = S.tables.map(t => {
    const g = t.game;
    let status = 'empty';
    if (g) status = g.status === 'review' ? (g.review && g.review.staff ? 'staff' : 'review') : g.status === 'confirm' ? 'confirm' : 'playing';
    else if (t.champ && t.challenger) status = 'checkin';
    else if (t.champ) status = 'waiting';
    const pub = { id: t.id, name: t.name, ref: t.ref, camera: refereed(t, now), camLive: camOn(t, now), gameType: t.gameType, status, streak: t.streak, champ: seatPub(t.champ, t, 'champ'), challenger: seatPub(t.challenger, t, 'challenger'), lastGame: t.lastGame || null, frameAt: t.frameAt || null, practice: t.practice || null, canUndo: !!(S.undo && S.undo[t.id] && S.undo[t.id].length) };
    if (g) {
      pub.game = { id: g.id, mode: g.mode, rated: g.rated, startedAt: g.startedAt, minutes: Math.max(0, Math.round((now - g.startedAt) / MIN)), left: g.mode === 'sim' ? Math.max(1, Math.round((g.endsAt - now) / MIN)) : null, status: g.status };
      if (g.mode === 'camera') Object.assign(pub.game, { gameType: g.gameType || t.gameType, lastReason: g.lastReason || '', turn: g.turn, groups: g.groups, onTable: g.onTable, positions: g.positions, lastShot: g.lastShot, shots: g.shots.slice(-14), review: g.review, ballInHand: g.ballInHand, winner: g.winner, winReason: g.winReason || '', confirm: g.confirm });
      if (g.mode === 'manual') Object.assign(pub.game, { winner: g.winner, confirm: g.confirm });
    }
    return pub;
  });
  const waiting = S.queue.filter(q => q.status === 'waiting' || q.status === 'called');
  const queue = waiting.map(q => ({ ticket: q.ticket, name: q.name, gameType: q.gameType, refOnly: q.refOnly, status: q.status, table: q.table ? (S.tables.find(t => t.id === q.table) || {}).name : null, eta: E[q.ticket] || null, position: q.status === 'waiting' ? S.queue.filter(x => x.status === 'waiting').indexOf(q) + 1 : 0 }));
  // Leaderboard with shot stats and badges: sharpshooter (best average shot, 5+ shots), fair play (fewest fouls per shot, 5+ shots), best shot (85+).
  const leaderboard = Object.entries(S.players).map(([pid, p]) => ({ pid, name: p.name, rating: p.rating, w: p.w, l: p.l, matches: (p.w || 0) + (p.l || 0), winRate: (p.w || 0) + (p.l || 0) ? Math.round(100 * (p.w || 0) / ((p.w || 0) + (p.l || 0))) : null, shots: p.shots || 0, avgShot: p.shots ? Math.round(p.scoreSum / p.shots) : null, fouls: p.fouls || 0, best: p.best || 0, badges: [] }));
  const top = (f, ok) => leaderboard.filter(ok).sort((a, b) => f(b) - f(a))[0];
  const sharp = top(r => r.avgShot, r => r.shots >= 5); if (sharp) sharp.badges.push('sharpshooter');
  const fair = top(r => -r.fouls / r.shots, r => r.shots >= 5); if (fair) fair.badges.push('fair_play');
  const bestShot = top(r => r.best, r => r.shots >= 1); if (bestShot && bestShot.best >= 85) bestShot.badges.push('best_shot');
  leaderboard.sort((a, b) => b.rating - a.rating);
  const pname = String(player || '').trim().toLowerCase(), mi = pname ? leaderboard.findIndex(r => r.name.toLowerCase() === pname) : -1;
  const my = mi < 0 ? null : Object.assign({}, leaderboard[mi], { rank: mi + 1, of: leaderboard.length,

        if (names.length !== 2 || names[0].toLowerCase() === names[1].toLowerCase()) return fail('A match needs two different player names.');
        if (g && g.status !== 'confirm' && String(p.force) !== '1') return fail('A game is being played on ' + t.name + '. Replace it?', 409);
        pushUndo(S, t);
        const n = String(p.gameType || p.game_type || '8').replace(/[^0-9]/g, '');
        t.gameType = ['8', '9', '10'].includes(n) ? n + '-ball' : '8-ball';
        [t.champ, t.challenger].forEach(sd => { const qq = sd && sd.ticket ? findTicket(S, sd.ticket) : null; if (qq && ['called', 'playing'].includes(qq.status)) qq.status = 'done'; });
        const seatFor = (name, side) => {
          const pid = findPid(S, name, true), qq = S.queue.find(x => x.pid === pid && ['waiting', 'called'].includes(x.status));
          if (qq) { qq.status = 'playing'; qq.table = t.id; qq.seat = side; }
          return { pid, name: S.players[pid].name, ticket: qq ? qq.ticket : null, real: !!qq, staff: !qq, present: true };
        };
        t.game = null; t.streak = 0; t.frameAt = null; t.practice = null;
        t.challenger = seatFor(names[0], 'challenger'); t.champ = seatFor(names[1], 'champ'); t.breaker = 'challenger';   // the first name breaks
        log(S, now(), 'table', 'Staff started ' + names[0] + ' vs ' + names[1] + ' (' + t.gameType + ') on ' + t.name);
        startGame(S, t, now());
        break;
      }
      if (action === 'next_match') { settle(S, now(), notes); if (!t.game && !(t.champ && t.challenger)) return fail('Nobody is waiting in the queue for ' + t.name + '.'); break; }
      if (action === 'reset_table') {
        pushUndo(S, t);
        [t.champ, t.challenger].forEach(sd => { const qq = sd && sd.ticket ? findTicket(S, sd.ticket) : null; if (qq && ['called', 'playing'].includes(qq.status)) qq.status = 'done'; });
        t.game = null; t.champ = null; t.challenger = null; t.streak = 0; t.frameAt = null; t.practice = null;
        log(S, now(), 'table', 'Staff cleared ' + t.name);
        settle(S, now(), notes);
        break;
      }
      if (action === 'end_match') {
        if (!g) return fail('No game being played on ' + t.name + '.');
        const w = sideByName(t, p.winner); if (!w) return fail('Pick the winner: ' + [t.champ, t.challenger].filter(Boolean).map(x => x.name).join(' or ') + '.');
        pushUndo(S, t);
        finishGame(S, t, w, now(), notes, 'ended by staff');
        settle(S, now(), notes);
        break;
      }
      if (!live) return fail(!g ? 'No game is being played on ' + t.name + '.' : g.mode !== 'camera' ? (refereed(t, now()) ? 'The camera is not following this game on ' + t.name : t.name + ' has no camera') + ', so staff can only declare the winner or clear the table.' : g.status === 'review' ? 'Play on ' + t.name + ' is paused for a foul review. Decide the review first.' : 'The game on ' + t.name + ' is over. The players are confirming the result.');
      pushUndo(S, t);
      if (action === 'switch_turn') { g.turn = otherSide(g.turn); g.ballInHand = false; g.lastReason = 'Turn switched by staff: ' + t[g.turn].name + ' to shoot'; log(S, now(), 'table', t.name + ' · ' + g.lastReason); }
      else if (action === 'foul') { g.turn = otherSide(g.turn); g.ballInHand = true; g.lastReason = 'Foul called by staff: ball in hand for ' + t[g.turn].name; log(S, now(), 'foul', t.name + ' · ' + g.lastReason); }
      else if (action === 'set_group') {
        if ((g.gameType || t.gameType) !== '8-ball') { popUndo(S, t); return fail('Groups only exist in 8-ball.'); }
        const sd = sideByName(t, p.player); if (!sd) { popUndo(S, t); return fail('Unknown player.'); }
        const grp = p.group === 'stripes' ? 'stripes' : 'solids';
        g.groups[sd] = grp; g.groups[otherSide(sd)] = grp === 'solids' ? 'stripes' : 'solids';
        g.lastReason = t[sd].name + ' set to ' + grp + ' by staff'; log(S, now(), 'table', t.name + ' · ' + g.lastReason);
      }
      break;
    }
  }
  const nFin = (S.finished || 0) - finBefore;
  const finished = nFin > 0 ? S.history.slice(0, nFin) : null;
  return { S, response: Object.assign(publicState(S, now(), p.ticket, p.player), extra || {}), notify: notes, finished };
}

// The public entry point: the state you pass in is left as it was, the changed state comes back in the result.
// Reading the state (action 'state') also moves time forward: timers run out, waiting players are called, simulated
// players act. So `now` must be the real time of the request, and a backend must save the returned state.
function handle(state, action, params, now) {
  const o = handleOn(clone(state), action, Object.assign({}, params), now);
  return { state: o.S, response: o.response, notify: o.notify, finished: o.finished };
}

// ===== web/src/client.js =====
// The only place the page talks to a backend. Paths are neutral (/api/...); the server's side of them is described in
// server/README.md. With no backend configured, the same calls run the rules engine inside the page on sample data.



// The build replaces the marker below: `node web/build.js --api /api` (or LOOPOOL_API=/api). Not replaced = local mode.
const API_BASE = "";

// A bar's staff open the bar app once with the key in the address (#bar&key=...). It is kept in this browser, taken out of the
// address bar, and sent as a header on the calls only staff may make (see "Staff key" in README.md).
const STAFF_KEY_STORE = 'loopool.staffKey';
function captureStaffKey() {
  if (typeof location === 'undefined' || typeof localStorage === 'undefined') return;
  try {
    const raw = location.hash.replace(/^#/, ''), m = /(?:^|&)key=([^&]*)/.exec(raw);
    if (!m) return;
    localStorage.setItem(STAFF_KEY_STORE, decodeURIComponent(m[1]));
    const rest = raw.split('&').filter(x => !/^key=/.test(x)).join('&');
    history.replaceState(null, '', location.pathname + location.search + (rest ? '#' + rest : ''));
  } catch (e) { /* no storage in this browser: staff actions will say the key is missing */ }
}
function staffHeaders() {
  try { const k = localStorage.getItem(STAFF_KEY_STORE); return k ? { 'X-Staff-Key': k } : {}; } catch (e) { return {}; }
}
captureStaffKey();

function createClient(apiBase, local) {
  const base = String(apiBase || '').replace(/\/+$/, '');
  let sample = null;                                   // local mode: the whole venue state lives here
  const json = async r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); };
  return {
    remote: !!base,
    base,
    staffHeaders,
    // Reads need no side effects on the player's side, so they are GETs; everything else is a POST with a JSON body.
    // Both answer with the full public state: { ok, tables, queue, leaderboard, venue, events, me?, ... }.
    async action(action, params) {
      params = Object.assign({}, params || {});
      if (!base) {
        if (!sample) sample = local.sampleState(Date.now());
        const o = local.handle(sample, action, params, Date.now());
        sample = o.state;
        return JSON.parse(JSON.stringify(o.response));
      }
      let j;
      if (action === 'state') {
        const u = new URL(base + '/state', typeof location !== 'undefined' ? location.href : undefined);
        Object.entries(params).forEach(([k, v]) => { if (v != null) u.searchParams.set(k, String(v)); });
        j = await json(await fetch(u, { cache: 'no-store', headers: staffHeaders() }));
      } else {
        j = await json(await fetch(base + '/action', { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, staffHeaders()), body: JSON.stringify(Object.assign({ action }, params)), cache: 'no-store' }));
      }
      if (!j || !j.tables) throw new Error('unexpected reply from the server');
      return j;
    },
    // "Ask the referee". Local mode has no AI to ask.
    async ask(question, ticket, key) {
      if (!base) return { ok: false, error: 'The AI referee needs the backend. It is not available in local mode.' };
      const r = await fetch(base + '/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ q: question, ticket: ticket || '', k: key || '' }), cache: 'no-store' });
      return json(r);
    },
    // Bar set-up: read a website or Google Maps link into a profile.
    async lookupProfile(url) {
      if (!base) return { ok: false, error: 'Auto-fill needs the backend. Fill the profile in yourself in local mode.' };
      return json(await fetch(base + '/profile-lookup?url=' + encodeURIComponent(url), { cache: 'no-store', headers: staffHeaders() }));
    },
    // The after-shot photo of a table, for the bar TV and the phones.
    frameUrl(tableId, at) { return base ? base + '/frame?table=' + encodeURIComponent(tableId) + '&at=' + encodeURIComponent(at) : null; },
  };
}
const client = createClient(API_BASE === '__API_BASE__' ? '' : API_BASE, { handle, sampleState });

// Every word the page shows comes from one English table (the app is English only, Nick 2026-11-16), so wording stays in
// one place. The same file keeps the one thing a person sets in the header (light or dark) and words the "are my changes
// saved" line.
//
//   tr('queue.next')                      -> "Next up"
//   tr('wait.ahead', { n: 2 })            -> "2 people ahead of you"      (a key ending _1 is used when n is 1)
//   trh('called.vs', { name })            -> the same, with the values made safe to put in HTML
//   addStrings({ 'a.key': '...' })        -> the strings files (strings-*.js) fill the table
//
// Sentences the server writes itself (the activity feed, a refusal's reason, the AI referee's words) arrive in English
// and are shown as they are.
const STRINGS = {};
const LOCALE = 'en-US';   // for clock times and dates: "9:41 PM", "Tue, Nov 17"

function addStrings(table) { Object.assign(STRINGS, table); }

function lookup(key, one) {
  if (one && STRINGS[key + '_1'] != null) return STRINGS[key + '_1'];
  return STRINGS[key] != null ? STRINGS[key] : key;
}
function tr(key, vars) {
  const text = lookup(key, !!vars && Number(vars.n) === 1 && vars.n !== '');
  return vars ? text.replace(/\{(\w+)\}/g, (m, k) => (vars[k] == null ? m : String(vars[k]))) : text;
}
const escHTML = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function trh(key, vars) {
  const safe = {};
  if (vars) Object.keys(vars).forEach(k => { safe[k] = escHTML(vars[k]); });
  return tr(key, vars ? safe : undefined);
}
// A place in line: 1st, 2nd, 3rd, 4th ...
function ord(n) {
  const v = n % 100, s = v >= 11 && v <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] || 'th';
  return n + s;
}
// "Sam and Lee"
function pair(a, b) { return tr('common.and', { a, b }); }

// ---------- what the person chose in the header: light or dark ----------
// `storage` is the browser's localStorage (or anything with getItem and setItem); with none, the choice lasts for this visit.
// Dark is the default on every screen.
function createPrefs(storage) {
  const mem = {};
  const read = k => { try { return storage ? storage.getItem('loopool.' + k) : null; } catch (e) { return null; } };
  const write = (k, v) => { mem[k] = v; try { if (storage) storage.setItem('loopool.' + k, v); } catch (e) { /* kept for this visit only */ } };
  const P = {
    theme() { const v = mem.theme || read('theme'); return v === 'light' ? 'light' : 'dark'; },
    setTheme(v) { write('theme', v === 'light' ? 'light' : 'dark'); return P.theme(); },
    toggleTheme() { return P.setTheme(P.theme() === 'dark' ? 'light' : 'dark'); },
  };
  return P;
}

// ---------- "are my changes saved?" ----------
// save = { kind, at, why }: kind is one of
//   local    no backend: what you do stays in this browser tab
//   idle     connected, nothing changed yet
//   saving   a change is on its way to the bar's server
//   saved    the last change was stored (at = when)
//   error    the change did not reach the server (the header offers Retry)
//   disk     the server has the change but could not write it to its disk yet (the header offers Retry)
//   refused  the server said no (why = its reason)
//   offline  the board cannot be refreshed (at = when it last was)
// Returns { text, retry } for the header; `time` turns a timestamp into a clock time.
function saveLabel(save, time) {
  const at = save && save.at ? (time ? time(save.at) : String(save.at)) : '';
  switch (save && save.kind) {
    case 'local': return { text: tr('save.local'), retry: false };
    case 'saving': return { text: tr('save.saving'), retry: false };
    case 'saved': return { text: tr('save.saved', { time: at }), retry: false };
    case 'error': return { text: tr('save.error'), retry: true };
    case 'disk': return { text: tr('save.disk'), retry: true };
    case 'refused': return { text: tr('save.refused'), retry: false };
    case 'offline': return { text: at ? tr('save.offline', { time: at }) : tr('save.offlineNow'), retry: true };
    default: return { text: tr('save.idle'), retry: false };
  }
}
// The longer explanation shown when the line is tapped.
function saveDetail(save, time) {
  const at = save && save.at ? (time ? time(save.at) : String(save.at)) : '';
  switch (save && save.kind) {
    case 'local': return tr('save.localMore');
    case 'saving': return tr('save.savingMore');
    case 'saved': return tr('save.savedMore', { time: at });
    case 'error': return tr('save.errorMore');
    case 'disk': return tr('save.diskMore');
    case 'refused': return tr('save.refusedMore', { why: (save && save.why) || '' });
    case 'offline': return tr('save.offlineMore');
    default: return tr('save.idleMore');
  }
}

  // The camera page: a tab per table this device watches, an "Add a table" picker, and one shared poll of the venue.

    }

<div class="cam-view">
  <div class="cam-top"><span class="cam-label">Table camera</span></div>
  <div class="cam-tabs" role="tablist" aria-label="Tables on this camera page">
    <span data-r="tabs" style="display:contents"></span>
    <div class="cam-add" data-r="addRow"><select data-r="addSel" aria-label="Table to add"></select><button class="cam-b" data-r="addBtn" title="Watch another table from this device, for example with a second webcam">Add table</button></div>
  </div>
  <div data-r="units" style="display:contents"></div>
</div>`;
    const root = el.querySelector('.cam-view');
    const R = {}; root.querySelectorAll('[data-r]').forEach(n => { R[n.dataset.r] = n; });

    let venue = null;
    const fallback = ['T1', 'T2', 'T3', 'T4'].map((id, i) => ({ id, name: 'Table ' + (i + 1), ref: id === 'T1' }));
    const known = () => {
      const live = venue && venue.tables, app = typeof opts.tables === 'function' ? opts.tables() : opts.tables;
      const list = (live && live.length ? live : app && app.length ? app : fallback).map(t => ({ id: norm(t.id), name: t.name || norm(t.id).replace(/^T(\d+)$/, 'Table $1'), ref: t.ref }));
      return list;
    };
    const info = id => known().find(t => t.id === id);
    const nameOf = id => (info(id) || {}).name || id.replace(/^T(\d+)$/, 'Table $1');
    const isRef = id => { const t = info(id); return t && typeof t.ref === 'boolean' ? t.ref : null; };

    const units = new Map(), tabs = new Map();
    let active = null, destroyed = false;

      const free = known().filter(t => !units.has(t.id));

      R.addRow.style.display = free.length ? '' : 'none';
    }

      tabs.forEach((b, id) => { b.querySelector('b').textContent = nameOf(id); });

    }

      tab.className = 'cam-tab'; tab.type = 'button'; tab.setAttribute('role', 'tab');
      tab.innerHTML = '<i></i><b></b><small>Stopped</small>';

        poll: () => pollState(),
        canRemove: () => units.size > 1,
        onRemove: () => removeTable(id),
        onState: (s, label) => { tab.className = 'cam-tab ' + (PILL_CLASS[s] || ''); tab.querySelector('small').textContent = label; },

    let pollBusy = false;

      if (destroyed || !base() || pollBusy) return;

        const cams = [...units.values()].filter(u => u.running()).map(u => u.id).join(',');

      running: () => [...units.values()].filter(u => u.running()).map(u => u.id),   // tables whose camera is on (bar app)
      stopAll() { units.forEach(u => { if (u.running()) u.stop(); }); },              // the bar ended the session

    };
  }

// ===== web/src/business.js =====
// ===== The bar app (#bar) =====
// Flow: register the bar once (auto-filled from its website or Google Maps link, read by the bar's server) -> the bar's
// home page (what needs staff, the tables, the queue, events: drawn by renderBarHome in app.js) -> start the night ->
// start a game (call the next players, type two names, or use the camera) -> camera set-up -> the bar TV view (stays on
// until staff press Exit) -> back to the home page. The menu in the header edits the bar, switches to the player app,
// or deletes the bar.
// The profile, the open / closed state and events are saved by the same engine as the queue (venue_save, venue_open,
// venue_delete, event_*), so every screen sees them.
// Every word comes from the string table (strings-biz.js, keys biz.*). The set-up form and the event form are built once
// and carry their words in data-i18n attributes, so they are filled from the table without losing what was typed.
// This file only uses the page helpers ($, esc, act, toast, S, tr, ...) inside functions, so it can load before app.js.
var BIZ = { dirty: false, editId: null, sig: {} };
var BAPP = { screen: 'home', camFrom: 'start', editing: false, cam: null, lastOpen: null, formOpen: false, startTable: null, sig: {} };
var BIZ_DAYS = [['mon', 'Monday'], ['tue', 'Tuesday'], ['wed', 'Wednesday'], ['thu', 'Thursday'], ['fri', 'Friday'], ['sat', 'Saturday'], ['sun', 'Sunday']];   // shown through tr('day.' + key)
var BIZ_KINDS = { tournament: 'Tournament', league: 'League night', social: 'Social night', lesson: 'Lesson or coaching' };                                  // shown through tr('kind.' + key)

function bizTime(t) {                                        // "19:30" -> "7:30 PM"
  const m = /^(\d\d):(\d\d)$/.exec(t || ''); if (!m) return '';
  const d = new Date(2000, 0, 1, Number(m[1]), Number(m[2]));
  return d.toLocaleTimeString(LOCALE, m[2] === '00' ? { hour: 'numeric', hour12: true } : { hour: 'numeric', minute: '2-digit', hour12: true }).replace(/\s?a\.?m\.?$/i, ' AM').replace(/\s?p\.?m\.?$/i, ' PM');
}
function bizDate(iso) { const d = new Date(iso + 'T12:00:00'); return isNaN(d) ? null : d; }
function bizDay(iso) {                                       // "2026-11-17" -> "Tue Nov 17"
  const d = bizDate(iso); if (!d) return iso;
  return d.toLocaleDateString(LOCALE, { weekday: 'short', day: 'numeric', month: 'short' }).replace(/[.,]/g, '');
}
function bizDayParts(iso) {                                  // the same day in two pieces: { day: "Tue", date: "Nov 17" }
  const d = bizDate(iso); if (!d) return { day: iso, date: '' };
  return { day: d.toLocaleDateString(LOCALE, { weekday: 'short' }).replace(/\./g, ''), date: d.toLocaleDateString(LOCALE, { day: 'numeric', month: 'short' }).replace(/\./g, '') };
}
function bizToday(v, now) {                                  // "Open today 4 PM to 2 AM" from the weekly hours
  if (!v || !v.hours) return '';
  const h = v.hours[BIZ_DAYS[(new Date(now).getDay() + 6) % 7][0]];
  if (!h) return '';
  if (h.closed) return tr('biz.closedToday');
  const open = bizTime(h.open), close = bizTime(h.close);
  return open && close ? tr('biz.openToday', { open, close }) : '';
}
function bizSig(st) { return JSON.stringify([st.venue, st.events]); }
function bizSetKey(el, key) { if (!el) return; if (key) { el.dataset.i18n = key; el.textContent = tr(key); } else { delete el.dataset.i18n; el.textContent = ''; } }
function bizBackBtn(act, key) {                              // a back button for a form that is built once
  const html = backBtn(act, ''), out = html.replace(/<\/button>\s*$/, `<span data-i18n="${key}"></span></button>`);
  return out === html ? backBtn(act, tr(key)) : out;
}

  if (note && note.textContent !== text) note.textContent = text;
}
function setupHTML(mode) {
  const hours = BIZ_DAYS.map(([d]) => `<div class="biz-hr" role="group" aria-labelledby="bh-${d}"><span id="bh-${d}" data-i18n="day.${d}"></span>

function bizFillProfile(el, v) {
  const f = $('#bizProfile', el); if (!f) return;
  ['name', 'about', 'address', 'mapsUrl', 'phone', 'website', 'tableCount', 'tableBrand', 'tableSize', 'cues', 'lat', 'lng'].forEach(k => { if (f.elements[k]) f.elements[k].value = v[k] == null || (k === 'cues' && !v[k]) ? '' : v[k]; });
  BIZ_DAYS.forEach(([d]) => { const h = (v.hours || {})[d] || {}; f.elements['h-' + d + '-open'].value = h.open || ''; f.elements['h-' + d + '-close'].value = h.close || ''; f.elements['h-' + d + '-closed'].checked = !!h.closed; });
}
function bizReadProfile(f) {
  const v = {};
  ['name', 'about', 'address', 'mapsUrl', 'phone', 'website', 'tableBrand', 'tableSize'].forEach(k => { v[k] = f.elements[k].value.trim(); });
  v.tableCount = Number(f.elements.tableCount.value) || 0; v.cues = Number(f.elements.cues.value) || 0;
  const g = /@(-?\d+\.\d+),(-?\d+\.\d+)/.exec(v.mapsUrl) || /!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/.exec(v.mapsUrl);   // map pin, for distances
  if (g) { v.lat = Number(g[1]); v.lng = Number(g[2]); } else if (f.elements.lat.value) { v.lat = Number(f.elements.lat.value); v.lng = Number(f.elements.lng.value); }
  v.hours = {}; BIZ_DAYS.forEach(([d]) => { v.hours[d] = { open: f.elements['h-' + d + '-open'].value, close: f.elements['h-' + d + '-close'].value, closed: f.elements['h-' + d + '-closed'].checked }; });
  return v;
}
function bindSetup(el) {
  const pf = $('#bizProfile', el);
  pf.addEventListener('input', () => { BIZ.dirty = true; bizSetKey($('[data-biz-saved]', el), 'biz.unsaved'); });
  pf.addEventListener('submit', async e => {
    e.preventDefault();
    const v = bizReadProfile(pf), first = !(S.state && S.state.venue.setup);
    if (!v.name) return toast(tr('biz.needName'));
    if (v.mapsUrl && !/^https:\/\//.test(v.mapsUrl)) return toast(tr('biz.mapsHttps'));
    if (v.website && !/^https:\/\//.test(v.website)) return toast(tr('biz.webHttps'));
    const r = await act('venue_save', { profile: v });
    if (r && r.ok) { BIZ.dirty = false; bizSetKey($('[data-biz-saved]', el), null); BAPP.editing = false; BAPP.screen = 'home'; BAPP.sig = {}; toast(tr(first ? 'biz.registered' : 'biz.profileSaved')); render(); window.scrollTo(0, 0); }
  });
}
// Auto-fill: the bar's server opens the link and reads the page (GET /api/profile-lookup). The sample bar has no server,
// so there the form is filled in by hand.
async function bizAutofill() {
  const url = $('#afUrl').value.trim(), st = $('#afStatus'), btn = $('#afBtn');
  const say = text => { st.removeAttribute('data-i18n'); st.textContent = text; };   // from here on the line reports this try, not the hint
  if (!url) return toast(tr('biz.afNeedLink'));
  if (!client.remote) return say(tr('biz.afSample'));
  btn.disabled = true; say(tr('biz.afReading'));
  let res;
  try {
    res = await client.lookupProfile(url);
  } catch (e) { res = { ok: false, error: tr('biz.afNoServer') }; }
  btn.disabled = false;
  if (!res || !res.ok) return say((res && res.error) || tr('biz.afFailed'));
  const f = $('#bizProfile'), p = res.profile || {}; let n = 0;
  ['name', 'about', 'address', 'mapsUrl', 'phone', 'website', 'tableCount', 'tableBrand', 'tableSize', 'cues'].forEach(k => { if (p[k] != null && p[k] !== '' && f.elements[k]) { f.elements[k].value = p[k]; f.elements[k].classList.add('filled'); n++; } });
  if (p.lat != null && p.lng != null) { f.elements.lat.value = p.lat; f.elements.lng.value = p.lng; }
  if (p.hours) { BIZ_DAYS.forEach(([d]) => { const h = p.hours[d]; if (!h) return; f.elements['h-' + d + '-open'].value = h.open || ''; f.elements['h-' + d + '-close'].value = h.close || ''; f.elements['h-' + d + '-closed'].checked = !!h.closed; }); n++; }
  BIZ.dirty = true; bizSetKey($('[data-biz-saved]'), 'biz.unsaved');
  say(tr('biz.afDone', { n }) + (res.note ? ' ' + res.note : ''));   // the server says when the AI was off or failed
}


// ---------- the bar app ----------
function renderBizApp(st) {
  const v = st.venue || {}, root = $('#v-biz');
  // the night was ended on another device: the camera on this device stops too
  if (BAPP.lastOpen && !v.open && BAPP.cam && BAPP.cam.running().length) { BAPP.cam.stopAll(); toast(tr('biz.camStoppedElsewhere')); }
  BAPP.lastOpen = !!v.open;
  const screen = !v.setup ? 'setup' : BAPP.editing ? 'setup' : BAPP.screen;
  const tv = screen === 'tv';
  document.body.classList.toggle('kiosk', tv); document.body.classList.toggle('tvmode', tv); if (!tv) document.body.classList.remove('tvfull');
  // the header (name, open or closed, saved or not, theme, menu) stays on every screen but the TV view
  $('.hdr', root).hidden = tv;
  const name = v.setup && v.name ? v.name : 'Loopool', bname = $('[data-bname]', root);
  if (bname.textContent !== name) bname.textContent = name;
  const chip = !v.setup ? '' : `<span class="biz-pill${v.open ? ' on' : ''}">${trh(v.open ? 'biz.openPill' : 'biz.closedPill')}</span>`, bchip = $('[data-bchip]', root);
  if (bchip.dataset.sig !== chip) { bchip.dataset.sig = chip; bchip.innerHTML = chip; }
  $$('[data-bs]', root).forEach(el => {
    const on = el.dataset.bs === screen;
    if (el.dataset.bs === 'camera' && BAPP.cam) { el.hidden = false; el.classList.toggle('offstage', !on); }   // a running camera keeps going off screen
    else el.hidden = !on;
  });
  if (screen === 'setup') renderSetup($('[data-bs="setup"]', root), st);
  else if (screen === 'home') renderBizHome(root, st);
  else if (screen === 'start') renderStartGame($('[data-bs="start"]', root), st);

// Start a game: call the next people in the queue, type two names, or use the camera referee

  const ids = ['qTable', 'hTable', 'hGame', 'hP1', 'hP2'], kept = {};
  if (BAPP.sig.start != null) ids.forEach(id => { const f = $('#' + id, el); if (f) kept[id] = f.value; });

  const nextOpts = freeTables.map(t => `<option value="${esc(t.id)}">${esc([tname(t), t.ref ? tr('biz.optCam') : ''].filter(Boolean).join(' · '))}</option>`).join('');
  const gameOpts = ['8', '9', '10'].map(g => `<option value="${g}">${esc(gname(g + '-ball'))}</option>`).join('');
  const nextNames = waiting.length > 1 ? pair(waiting[0].name, waiting[1].name) : waiting.length ? waiting[0].name : '';
  el.innerHTML = `<div class="bstart biz">
    ${backBtn('biz-home', tr('common.back'))}
    <h1 class="h1">${ev ? trh('biz.startEvent', { title: ev.title }) : trh('biz.startTitle')}</h1>
    <section class="biz-card">
      <div class="biz-hd"><span class="sign">${trh('biz.nextTitle')}</span></div>
      <p class="dim">${waiting.length ? trh('biz.nextWho', { names: nextNames }) : trh('biz.nextNone')}</p>
      ${waiting.length && !freeTables.length ? `<p class="dim">${trh('biz.nextBusy', { names: nextNames })}</p>` : `<div class="biz-row"><select id="qTable" aria-label="${trh('biz.tableLabel')}">${nextOpts}</select><button class="b go big" data-act="biz-callnext"${waiting.length ? '' : ' disabled'}>${trh('biz.nextBtn')}</button></div>`}
    </section>
    <section class="biz-card">
      <div class="biz-hd"><span class="sign">${trh('biz.handTitle')}</span></div>
      <form class="biz-form" id="handForm" autocomplete="off">
        <div class="biz-f"><label for="hTable">${trh('biz.tableLabel')}</label><select id="hTable">${tableOpts}</select></div>
        <div class="biz-f"><label for="hGame">${trh('biz.gameLabel')}</label><select id="hGame">${gameOpts}</select></div>
        <div class="biz-f"><label for="hP1">${trh('biz.breaker')}</label><input id="hP1" maxlength="24" placeholder="${trh('biz.namePh')}"></div>
        <div class="biz-f"><label for="hP2">${trh('biz.opponent')}</label><input id="hP2" maxlength="24" placeholder="${trh('biz.namePh')}"></div>
        <div class="biz-row wide"><button class="b go big" type="submit">${trh('biz.handBtn')}</button></div>
      </form>
    </section>
    <section class="biz-card">
      <div class="biz-hd"><span class="sign">${trh('biz.camTitle')}</span></div>
      <p class="dim">${ref ? trh('biz.camMore', { table: tname(ref) }) : trh('biz.camMoreNoRef')}</p>
      <div class="biz-row"><button class="b big" data-act="biz-tocam">${trh('biz.camBtn')}</button></div>
    </section>
  </div>`;
  if (BAPP.startTable && st.tables.some(t => t.id === BAPP.startTable)) ['qTable', 'hTable'].forEach(id => { const f = $('#' + id, el); if (f) f.value = BAPP.startTable; });
  else { const firstFree = st.tables.find(t => !t.game); if (firstFree) $('#hTable', el).value = firstFree.id; }
  Object.keys(kept).forEach(id => { const f = $('#' + id, el); if (f && kept[id] != null) f.value = kept[id]; });
  $('#handForm', el).addEventListener('submit', async e => {
    e.preventDefault();
    const table = $('#hTable').value, p1 = $('#hP1').value.trim(), p2 = $('#hP2').value.trim();

    const t = ((S.state && S.state.tables) || st.tables).find(x => x.id === table), where = t ? tname(t) : table;
    const params = { table, players: p1 + ',' + p2, gameType: $('#hGame').value };

async function openNight() { const v = S.state && S.state.venue; if (v && !v.open) await act('venue_open', { open: '1', event: BAPP.event || undefined }, true); }
